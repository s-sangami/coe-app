function ArchiveModal({seasons,currentSeason,toast,onClose}){
  const [working,setWorking]=useState(null); // season id being archived
  const [done,setDone]=useState(new Set());
  
  // List seasons that are NOT the current active season
  const archivableSeasons=seasons.filter(s=>s.id!==currentSeason?.id);
  
  async function exportAndArchive(s){
    if(!confirm(`Archive ${s.name}?\n\nThis will:\n  1. Download all data as JSON file\n  2. DELETE the season + claims + date rows from database\n\nMake sure to KEEP the downloaded JSON file safely.`)) return;
    if(!confirm(`Final confirmation: PERMANENTLY DELETE "${s.name}" from database after backup download?`)) return;
    
    setWorking(s.id);
    try{
      // 1. Fetch all claims + date rows for this season
      const {data:claims}=await supabase.from('claims').select('*').eq('season_id',s.id);
      const claimIds=(claims||[]).map(c=>c.id);
      let dateRows=[];
      if(claimIds.length){
        const {data:drs}=await supabase.from('claim_date_rows').select('*').in('claim_id',claimIds);
        dateRows=drs||[];
      }
      // 2. Create JSON archive
      const archive={
        archived_at:new Date().toISOString(),
        season:s,
        total_claims:claims?.length||0,
        total_date_rows:dateRows.length,
        claims:claims||[],
        claim_date_rows:dateRows,
      };
      // 3. Download JSON
      const blob=new Blob([JSON.stringify(archive,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;
      a.download=`EPMCE_archive_${s.id}_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
      // 4. Delete from DB
      if(claimIds.length){
        await supabase.from('claim_date_rows').delete().in('claim_id',claimIds);
      }
      await supabase.from('claims').delete().eq('season_id',s.id);
      await supabase.from('exam_seasons').delete().eq('id',s.id);
      logAction('exam_seasons',s.id,'DELETE',s,{archived:true,claim_count:claims?.length||0});
      setDone(d=>new Set([...d,s.id]));
      toast.show(`Archived ${s.name} (${claims?.length||0} claims) — file saved to Downloads`,'success');
    }catch(e){
      toast.show('Archive failed: '+e.message,'error');
    }
    setWorking(null);
  }
  
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:20}} onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="card" style={{maxWidth:600,width:'100%',margin:0,maxHeight:'90vh',overflowY:'auto'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
          <div>
            <div style={{fontWeight:700,fontSize:18,marginBottom:4}}>📦 Archive Old Seasons</div>
            <div style={{fontSize:12,color:'var(--muted)'}}>Free up database space by archiving completed exam seasons. A JSON backup file is downloaded BEFORE deletion.</div>
          </div>
          <button className="BE" onClick={onClose}>✕</button>
        </div>
        <div style={{padding:'10px 12px',background:'#fffbeb',border:'1px solid #f6d860',borderRadius:7,fontSize:12,color:'#7a5c00',lineHeight:1.6,marginBottom:12}}>
          <strong>⚠️ Important:</strong> Archiving permanently deletes the season from the database after creating a JSON backup. Store the backup file safely (encrypted drive, college storage). To restore later, the backup file can be re-imported manually.
        </div>
        {archivableSeasons.length===0?
          <div style={{padding:24,textAlign:'center',color:'var(--muted)'}}>No seasons available to archive.<br/>The current active season cannot be archived.</div>
          :
          <div>
            {archivableSeasons.map(s=>(
              <div key={s.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'12px',border:'1px solid var(--border)',borderRadius:8,marginBottom:8,background:done.has(s.id)?'#f0faf4':'#fff'}}>
                <div>
                  <div style={{fontWeight:600,fontSize:14}}>{s.name}</div>
                  <div style={{fontSize:11,color:'var(--muted)'}}>Code: {s.id}</div>
                </div>
                {done.has(s.id)?
                  <span style={{fontSize:12,color:'var(--success)',fontWeight:600}}>✓ Archived</span>
                  :working===s.id?
                  <span style={{fontSize:12,color:'var(--muted)'}}>Working…</span>
                  :
                  <button className="BD" onClick={()=>exportAndArchive(s)}>📦 Archive & Delete</button>
                }
              </div>
            ))}
          </div>
        }
        <div style={{display:'flex',justifyContent:'flex-end',marginTop:14}}>
          <button className="BS" onClick={onClose}>Close</button>
        </div>
      </div>
    </div>
  );
}

function Dashboard({season,toast,seasons}){
  const [showArchive,setShowArchive]=useState(false);
  const [stats,setStats]=useState([]);
  const [importOpen,setImportOpen]=useState(false);
  const [loading,setLoading]=useState(false);

  useEffect(()=>{if(season)loadStats();},[season]);

  async function loadStats(){
    setLoading(true);
    const {data}=await supabase.from('claims').select('work_type_id,amount').eq('season_id',season.id);
    if(data){
      const grouped={};
      data.forEach(r=>{
        if(!grouped[r.work_type_id])grouped[r.work_type_id]={count:0,total:0};
        grouped[r.work_type_id].count++;
        grouped[r.work_type_id].total+=Number(r.amount||0);
      });
      setStats(grouped);
    }
    setLoading(false);
  }

  const totalInt=INT_WORKS.reduce((s,w)=>s+Number(stats[w.id]?.total||0),0);
  const totalExt=EXT_WORKS.reduce((s,w)=>s+Number(stats[w.id]?.total||0),0);
  const totalAll=totalInt+totalExt;
  const totalCount=Object.values(stats).reduce((s,v)=>s+v.count,0);

  function downloadTemplate(){
    // Download a blank Excel template with all 21 work type sheets pre-formatted
    const wb=XLSX.utils.book_new();
    ALL_WORKS.forEach(w=>{
      const ws=buildWorkSheet(w,[],season); // empty claims = blank template with headers
      XLSX.utils.book_append_sheet(wb,ws,w.short.substring(0,31));
    });
    XLSX.writeFile(wb,`COE Claims Template - ${season?.name||''}.xlsx`);
    toast.show('Blank template downloaded — fill and re-import','success');
  }

  async function exportAll(){
    setLoading(true);
    const wb=XLSX.utils.book_new();
    // Load all claims with date rows
    const {data:allClaims}=await supabase.from('claims').select('*,claim_date_rows(*)').eq('season_id',season.id).order('name');
    // One sheet per work type
    ALL_WORKS.forEach(w=>{
      const wtClaims=(allClaims||[]).filter(c=>c.work_type_id===w.id);
      if(wtClaims.length===0) return;
      const ws=buildWorkSheet(w,wtClaims,season);
      XLSX.utils.book_append_sheet(wb,ws,w.short.substring(0,31));
    });
    // Add consolidated sheets
    const intClaims=(allClaims||[]).filter(c=>INT_WORKS.some(w=>w.id===c.work_type_id));
    const extClaims=(allClaims||[]).filter(c=>EXT_WORKS.some(w=>w.id===c.work_type_id));
    if(intClaims.length) XLSX.utils.book_append_sheet(wb,buildConsolidatedSheet('int',intClaims,season),'CONSOLIDATE INT');
    if(extClaims.length) XLSX.utils.book_append_sheet(wb,buildConsolidatedSheet('ext',extClaims,season),'CONSOLIDATE EXT');
    XLSX.writeFile(wb,`COE Claims Full - ${season?.name||''}.xlsx`);
    setLoading(false);
    toast.show('Full Excel downloaded','success');
  }

  return (
    <div>
      {showArchive&&<ArchiveModal seasons={seasons||[]} currentSeason={season} toast={toast} onClose={()=>setShowArchive(false)}/>}
      {importOpen&&<ImportModal season={season} toast={toast} onClose={()=>{setImportOpen(false);loadStats();}}/>}
      <div className="page-header" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:10}}>
        <div>
          <div className="page-title">Dashboard</div>
          <div className="page-sub">{season?.name} — COE Claims Overview</div>
        </div>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          <button className="BP" onClick={()=>setImportOpen(true)}>📥 Import from Excel</button>
          <button className="BS" onClick={downloadTemplate}>📋 Download Template</button>
          <button className="BS gold" onClick={exportAll}>⬇ Export All Sheets</button>
          <button className="BS" onClick={()=>setShowArchive(true)} style={{borderColor:'#7a5c00',color:'#7a5c00'}}>📦 Archive Old Seasons</button>
        </div>
      </div>

      <div className="stats-grid">
        <div className="stat-card"><div className="stat-label">Total Entries</div><div className="stat-val">{totalCount}</div><div className="stat-sub">Across all work types</div></div>
        <div className="stat-card"><div className="stat-label">Total Claims</div><div className="stat-val" style={{color:'var(--gold)'}}>{fmt(totalAll)}</div><div className="stat-sub">All staff combined</div></div>
        <div className="stat-card"><div className="stat-label">Internal Staff</div><div className="stat-val" style={{color:'var(--int)'}}>{fmt(totalInt)}</div><div className="stat-sub">{INT_WORKS.reduce((s,w)=>s+(stats[w.id]?.count||0),0)} entries</div></div>
        <div className="stat-card"><div className="stat-label">External Staff</div><div className="stat-val" style={{color:'var(--ext)'}}>{fmt(totalExt)}</div><div className="stat-sub">{EXT_WORKS.reduce((s,w)=>s+(stats[w.id]?.count||0),0)} entries</div></div>
      </div>

      <div className="card">
        <div style={{fontWeight:700,fontSize:14,marginBottom:14}}>Internal Staff Works</div>
        <div className="tbl-wrap">
          <table>
            <thead><tr><th>Work Type</th><th>Entries</th><th>Total Amount</th></tr></thead>
            <tbody>{INT_WORKS.map(w=>(
              <tr key={w.id}>
                <td><span className="badge badge-int">{w.short}</span> {w.label}</td>
                <td>{stats[w.id]?.count||0}</td>
                <td style={{fontWeight:600,color:'var(--int)'}}>{fmt(stats[w.id]?.total||0)}</td>
              </tr>
            ))}</tbody>
            <tfoot><tr><td style={{fontWeight:700}}>TOTAL</td><td style={{fontWeight:700}}>{INT_WORKS.reduce((s,w)=>s+(stats[w.id]?.count||0),0)}</td><td style={{fontWeight:700,color:'var(--int)'}}>{fmt(totalInt)}</td></tr></tfoot>
          </table>
        </div>
      </div>

      <div className="card">
        <div style={{fontWeight:700,fontSize:14,marginBottom:14}}>External Staff Works</div>
        <div className="tbl-wrap">
          <table>
            <thead><tr><th>Work Type</th><th>Entries</th><th>Total Amount</th></tr></thead>
            <tbody>{EXT_WORKS.map(w=>(
              <tr key={w.id}>
                <td><span className="badge badge-ext">{w.short}</span> {w.label}</td>
                <td>{stats[w.id]?.count||0}</td>
                <td style={{fontWeight:600,color:'var(--ext)'}}>{fmt(stats[w.id]?.total||0)}</td>
              </tr>
            ))}</tbody>
            <tfoot><tr><td style={{fontWeight:700}}>TOTAL</td><td style={{fontWeight:700}}>{EXT_WORKS.reduce((s,w)=>s+(stats[w.id]?.count||0),0)}</td><td style={{fontWeight:700,color:'var(--ext)'}}>{fmt(totalExt)}</td></tr></tfoot>
          </table>
        </div>
      </div>
    </div>
  );
}

// ─── CONSOLIDATED ─────────────────────────────────────────────
function Consolidated({type,season,toast}){
  const isInt=type==='int';
  const [rows,setRows]=useState([]);
  const [loading,setLoading]=useState(false);

  useEffect(()=>{if(season)load();},[season,type]);
  async function load(){
    setLoading(true);
    const workIds=(isInt?INT_WORKS:EXT_WORKS).map(w=>w.id);
    const {data}=await supabase.from('claims').select('*').in('work_type_id',workIds).eq('season_id',season.id).order('name');
    if(data)setRows(data);
    setLoading(false);
  }

  function exportConsolidated(){
    const wb=XLSX.utils.book_new();
    const ws=buildConsolidatedSheet(type,rows,season);
    XLSX.utils.book_append_sheet(wb,ws,isInt?'CONSOLIDATE INT':'CONSOLIDATE EXT');
    XLSX.writeFile(wb,`Consolidated ${isInt?'Internal':'External'} - ${season?.name||''}.xlsx`);
  }

  const total=rows.reduce((s,r)=>s+Number(r.amount||0),0);

  return (
    <div>
      <div className="page-header" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:10}}>
        <div>
          <div className="page-title">{isInt?'Internal':'External'} Consolidated</div>
          <div className="page-sub">{season?.name} · {rows.length} entries · {fmt(total)}</div>
        </div>
        <button className={`BS ${isInt?'':'ext'}`} onClick={exportConsolidated}>⬇ Download Consolidated Excel</button>
      </div>
      <div className="card">
        <div className="tbl-wrap">
          {loading?<div style={{padding:20,textAlign:'center',color:'var(--muted)'}}>Loading…</div>:
          rows.length===0?<div style={{padding:20,textAlign:'center',color:'var(--muted)'}}>No data.</div>:
          <table>
            <thead><tr>
              <th>#</th><th>Name</th><th>Dept</th>
              {!isInt&&<th>Claim</th>}
              <th>Account No</th><th>IFSC</th><th>Bank</th><th>Branch</th>
              {!isInt&&<th>College</th>}
              <th>Mobile</th><th>Amount</th>
            </tr></thead>
            <tbody>{rows.map((r,i)=>(
              <tr key={r.id}>
                <td>{i+1}</td>
                <td style={{fontWeight:600}}>{r.name}</td>
                <td>{r.dept||'-'}</td>
                {!isInt&&<td>{r.claim_desc||'-'}</td>}
                <td className="mono">{r.ac_no||'-'}</td>
                <td className="mono">{r.ifsc_code||'-'}</td>
                <td>{r.bank||'-'}</td>
                <td>{r.branch||'-'}</td>
                {!isInt&&<td>{r.college||'-'}</td>}
                <td className="mono">{r.mobile_no||'-'}</td>
                <td style={{fontWeight:700}}>{fmt(r.amount)}</td>
              </tr>
            ))}</tbody>
            <tfoot><tr><td colSpan={isInt?9:11} style={{fontWeight:700,textAlign:'right'}}>TOTAL</td><td style={{fontWeight:700,color:isInt?'var(--int)':'var(--ext)'}}>{fmt(total)}</td></tr></tfoot>
          </table>}
        </div>
      </div>
    </div>
  );
}

// ─── STAFF PROFILE (full page) ────────────────────────────────
function StaffProfile({staffId,onBack,toast,seasons}){
  const [staff,setStaff]=useState(null);
  const [allClaims,setAllClaims]=useState([]);
  const [seasonFilter,setSeasonFilter]=useState('all');
  const [loading,setLoading]=useState(false);

  useEffect(()=>{load();},[staffId]);
  async function load(){
    if(!staffId) return;
    setLoading(true);
    const {data:s}=await supabase.from('staff').select('*').eq('id',staffId).maybeSingle();
    if(s){
      setStaff(s);
      // Load ALL claims with this name across all seasons
      const {data:c}=await supabase.from('claims').select('*').ilike('name',s.name).order('created_at',{ascending:false});
      setAllClaims(c||[]);
    }
    setLoading(false);
  }

  if(loading) return <div style={{padding:40,textAlign:'center',color:'var(--muted)'}}>Loading…</div>;
  if(!staff) return <div className="card" style={{textAlign:'center',padding:40}}>Staff not found. <button className="BS" onClick={onBack}>← Back</button></div>;

  const isInt=staff.staff_type==='INT';
  const filteredClaims=seasonFilter==='all'?allClaims:allClaims.filter(c=>c.season_id===seasonFilter);
  const totalAcrossAllSeasons=allClaims.reduce((s,c)=>s+Number(c.amount||0),0);
  const filteredTotal=filteredClaims.reduce((s,c)=>s+Number(c.amount||0),0);

  // Group by season for the per-season summary
  const bySeasonId={};
  allClaims.forEach(c=>{
    if(!bySeasonId[c.season_id]) bySeasonId[c.season_id]={count:0,total:0};
    bySeasonId[c.season_id].count++;
    bySeasonId[c.season_id].total+=Number(c.amount||0);
  });

  return (
    <div>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:14}}>
        <button className="BE" onClick={onBack}>← Back to Staff Directory</button>
      </div>

      {/* PROFILE HEADER CARD */}
      <div className="card" style={{borderTop:`4px solid ${isInt?'var(--int)':'var(--ext)'}`}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:16,flexWrap:'wrap'}}>
          <div>
            <div style={{fontSize:22,fontWeight:700,marginBottom:4}}>{staff.name}</div>
            <div style={{fontSize:13,color:'var(--muted)',marginBottom:8}}>
              {staff.designation||''}
              {staff.dept&&<>{staff.designation?' · ':''}{staff.dept}</>}
            </div>
            <span className={`badge badge-${isInt?'int':'ext'}`}>{isInt?'🏛️ Internal':'👥 External'}</span>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:11,color:'var(--muted)',textTransform:'uppercase',letterSpacing:.5}}>Total Earnings (All Seasons)</div>
            <div style={{fontSize:28,fontWeight:700,color:'var(--gold)'}}>{fmt(totalAcrossAllSeasons)}</div>
            <div style={{fontSize:11,color:'var(--muted)'}}>{allClaims.length} total claim{allClaims.length!==1?'s':''}</div>
          </div>
        </div>
      </div>

      {/* BANK DETAILS CARD */}
      <div className="card">
        <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>🏦 Bank Details</div>
        <div className="form-grid">
          <div><div style={{fontSize:11,color:'var(--muted)',marginBottom:3}}>College</div><div style={{fontSize:13}}>{staff.college||'—'}</div></div>
          <div><div style={{fontSize:11,color:'var(--muted)',marginBottom:3}}>Mobile</div><div style={{fontSize:13}} className="mono">{staff.mobile_no||'—'}</div></div>
          <div><div style={{fontSize:11,color:'var(--muted)',marginBottom:3}}>Account No</div><div style={{fontSize:13}} className="mono">{staff.ac_no||'—'}</div></div>
          <div><div style={{fontSize:11,color:'var(--muted)',marginBottom:3}}>IFSC</div><div style={{fontSize:13}} className="mono">{staff.ifsc_code||'—'}</div></div>
          <div><div style={{fontSize:11,color:'var(--muted)',marginBottom:3}}>Bank</div><div style={{fontSize:13}}>{staff.bank||'—'}</div></div>
          <div><div style={{fontSize:11,color:'var(--muted)',marginBottom:3}}>Branch</div><div style={{fontSize:13}}>{staff.branch||'—'}</div></div>
        </div>
      </div>

      {/* SEASON-WISE BREAKDOWN */}
      {Object.keys(bySeasonId).length>0&&(
        <div className="card">
          <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>📊 Season-wise Earnings</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:10}}>
            {seasons.filter(sn=>bySeasonId[sn.id]).map(sn=>(
              <div key={sn.id} style={{background:'var(--bg)',padding:12,borderRadius:8,border:'1px solid var(--border)'}}>
                <div style={{fontSize:11,color:'var(--muted)',marginBottom:4}}>{sn.name}</div>
                <div style={{fontSize:18,fontWeight:700,color:'var(--gold)'}}>{fmt(bySeasonId[sn.id].total)}</div>
                <div style={{fontSize:11,color:'var(--muted)'}}>{bySeasonId[sn.id].count} claim{bySeasonId[sn.id].count>1?'s':''}</div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* WORKS TABLE WITH SEASON FILTER */}
      <div className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:10}}>
          <div style={{fontWeight:700,fontSize:14}}>🗂️ Works Done ({filteredClaims.length})</div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <span style={{fontSize:12,color:'var(--muted)'}}>Filter:</span>
            <select className="form-select" value={seasonFilter} onChange={e=>setSeasonFilter(e.target.value)} style={{minWidth:200}}>
              <option value="all">All Seasons ({allClaims.length})</option>
              {seasons.filter(sn=>bySeasonId[sn.id]).map(sn=><option key={sn.id} value={sn.id}>{sn.name} ({bySeasonId[sn.id].count})</option>)}
            </select>
          </div>
        </div>
        <div className="tbl-wrap">
          {filteredClaims.length===0?<div style={{padding:20,textAlign:'center',color:'var(--muted)'}}>No claims in selected season.</div>:
          <table>
            <thead><tr>
              <th>#</th><th>Date Added</th><th>Season</th><th>Work Type</th><th>Subject / Board / Description</th><th>Amount</th>
            </tr></thead>
            <tbody>{filteredClaims.map((c,i)=>{
              const wtX=ALL_WORKS.find(w=>w.id===c.work_type_id);
              const isClaimInt=INT_WORKS.some(w=>w.id===c.work_type_id);
              const sn=seasons.find(s=>s.id===c.season_id);
              const desc=c.subject_code?fmtSubjects(c.subject_code,c.subject_name):(c.board_name||c.claim_desc||'');
              const dt=c.created_at?new Date(c.created_at):null;
              return (
                <tr key={c.id}>
                  <td>{i+1}</td>
                  <td style={{fontSize:12,whiteSpace:'nowrap'}}>{dt?dt.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—'}</td>
                  <td style={{fontSize:12,color:'var(--muted)'}}>{sn?.name||c.season_id}</td>
                  <td><span className={`badge badge-${isClaimInt?'int':'ext'}`}>{wtX?.short||c.work_type_id}</span> <span style={{fontSize:12}}>{wtX?.label||''}</span></td>
                  <td style={{fontSize:12}}>{desc||'—'}</td>
                  <td style={{fontWeight:700}}>{fmt(c.amount)}</td>
                </tr>
              );
            })}</tbody>
            <tfoot><tr>
              <td colSpan={5} style={{fontWeight:700,textAlign:'right'}}>TOTAL</td>
              <td style={{fontWeight:700,color:'var(--gold)'}}>{fmt(filteredTotal)}</td>
            </tr></tfoot>
          </table>}
        </div>
      </div>
    </div>
  );
}

// ─── STAFF DIRECTORY ──────────────────────────────────────────
function StaffDirectory({season,toast,onViewProfile}){
  const [query,setQuery]=useState('');
  const [intStaff,setIntStaff]=useState([]);
  const [extStaff,setExtStaff]=useState([]);
  const [loading,setLoading]=useState(false);
  const [showAdd,setShowAdd]=useState(false);
  const [addForm,setAddForm]=useState({name:'',designation:'',dept:'',college:'',mobile_no:'',ac_no:'',ifsc_code:'',bank:'',branch:'',staff_type:'INT'});
  const [ifscStatus,setIfscStatus]=useState({state:'idle'});
  const ifscT=useRef(null);

  async function loadStaff(){
    setLoading(true);
    // Load master staff
    const {data:masterData}=await supabase.from('staff').select('*').order('name');
    // Also load claims to show works done
    const {data:claimsData}=await supabase.from('claims').select('*').eq('season_id',season.id);
    if(masterData){
      const worksByName={};
      (claimsData||[]).forEach(c=>{
        if(!worksByName[c.name]) worksByName[c.name]=[];
        worksByName[c.name].push(c);
      });
      const withWorks=masterData.map(s=>({...s,works:worksByName[s.name]||[]}));
      const filtered=query?withWorks.filter(s=>s.name.toLowerCase().includes(query.toLowerCase())):withWorks;
      setIntStaff(filtered.filter(s=>!s.staff_type||s.staff_type==='INT'));
      setExtStaff(filtered.filter(s=>s.staff_type==='EXT'));
    }
    setLoading(false);
  }

  useEffect(()=>{if(season)loadStaff();},[season,query]);

  async function addStaff(){
    if(!addForm.name.trim()){toast.show('Name is required','error');return;}
    // Block if name exists as opposite type
    const oppType=addForm.staff_type==='INT'?'EXT':'INT';
    const {data:oppExisting}=await supabase.from('staff').select('id').eq('name',addForm.name.trim()).eq('staff_type',oppType).maybeSingle();
    if(oppExisting){
      const oppLabel=oppType==='INT'?'Internal':'External';
      toast.show(`✕ "${addForm.name}" already exists as ${oppLabel} staff. A person cannot be both. Use a slightly different name to add a different person.`,'error');
      return;
    }
    const id=uuid();
    const payload={id,...addForm,name:addForm.name.trim()};
    const {error}=await supabase.from('staff').insert([payload]);
    if(error){toast.show(safeError(error,'Operation failed. Please try again.'),'error');return;}
    logAction('staff',id,'INSERT',null,{name:payload.name,staff_type:payload.staff_type,dept:payload.dept});
    toast.show('Staff added','success');
    setAddForm({name:'',designation:'',dept:'',college:'',mobile_no:'',ac_no:'',ifsc_code:'',bank:'',branch:'',staff_type:'INT'});
    setIfscStatus({state:'idle'});
    setShowAdd(false);
    loadStaff();
  }

  async function deleteStaff(id,name){
    if(!confirm(`Delete ${name} from staff directory?\n(Their claim entries will NOT be deleted)`))return;
    const {data:oldStaff}=await supabase.from('staff').select('name,staff_type').eq('id',id).maybeSingle();
    const {error}=await supabase.from('staff').delete().eq('id',id);
    if(error){toast.show(safeError(error,'Delete failed. Please try again.'),'error');return;}
    logAction('staff',id,'DELETE',oldStaff,null);
    toast.show('Staff deleted','info');
    loadStaff();
  }

  function onAddIfsc(v){
    const upper=(v||'').toUpperCase();
    setAddForm(f=>({...f,ifsc_code:upper}));
    clearTimeout(ifscT.current);
    if(upper.length===0){setIfscStatus({state:'idle'});return;}
    ifscT.current=setTimeout(async()=>{
      setIfscStatus({state:'checking'});
      const r=await lookupIFSC(upper);
      if(r.valid){
        setIfscStatus({state:'valid',data:r});
        setAddForm(f=>({...f,bank:r.bank,branch:r.branch}));
      } else if(r.network) setIfscStatus({state:'error',msg:r.reason});
      else setIfscStatus({state:'invalid',msg:r.reason});
    },400);
  }

  function renderTable(list,type){
    const color=type==='int'?'var(--int)':'var(--ext)';
    return list.length===0
      ? <div style={{padding:20,textAlign:'center',color:'var(--muted)',fontSize:13}}>No {type==='int'?'internal':'external'} staff.</div>
      : <table>
        <thead><tr><th>Name</th><th>Dept/College</th><th>Works</th><th></th></tr></thead>
        <tbody>{list.map((s,i)=>{
          const total=(s.works||[]).reduce((x,w)=>x+Number(w.amount||0),0);
          return <tr key={s.id}>
            <td onClick={()=>onViewProfile(s.id)} style={{cursor:'pointer',fontWeight:600}}>
              <div>{s.name}</div>
              {s.designation&&<div style={{fontSize:11,color:'var(--muted)',fontWeight:400}}>{s.designation}</div>}
            </td>
            <td onClick={()=>onViewProfile(s.id)} style={{cursor:'pointer',fontSize:12}}>{s.dept||s.college||'—'}</td>
            <td onClick={()=>onViewProfile(s.id)} style={{cursor:'pointer'}}>
              <span className={`badge badge-${type}`}>{s.works?.length||0}</span>
              {total>0&&<div style={{fontSize:11,fontWeight:700,color,marginTop:2}}>{fmt(total)}</div>}
            </td>
            <td><button className="BD" style={{padding:'3px 8px',fontSize:11}} onClick={()=>deleteStaff(s.id,s.name)}>🗑</button></td>
          </tr>;
        })}</tbody>
      </table>;
  }

  const intTotal=intStaff.reduce((s,r)=>s+(r.works||[]).reduce((x,w)=>x+Number(w.amount||0),0),0);
  const extTotal=extStaff.reduce((s,r)=>s+(r.works||[]).reduce((x,w)=>x+Number(w.amount||0),0),0);

  return (
    <div>
      <div className="page-header" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10,flexWrap:'wrap'}}>
        <div>
          <div className="page-title">Staff Directory</div>
          <div className="page-sub">{season?.name} — Master list of all internal and external staff</div>
        </div>
        <button className="BP" onClick={()=>setShowAdd(v=>!v)}>{showAdd?'✕ Cancel':'+ Add Staff'}</button>
      </div>

      {/* ADD FORM */}
      {showAdd&&(
        <div className="card" style={{borderLeft:'4px solid var(--int)'}}>
          <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>➕ Add New Staff Member</div>
          <div className="form-grid">
            <div className="form-group">
              <label className="form-label">Staff Type *</label>
              <select className="form-select" value={addForm.staff_type} onChange={e=>{
                const t=e.target.value;
                setAddForm(f=>({...f,staff_type:t,college:t==='INT'?'Er. Perumal Manimekalai College of Engineering':(f.college&&f.college.includes('PMC')?'':f.college)}));
              }}>
                <option value="INT">Internal (PMC)</option>
                <option value="EXT">External</option>
              </select>
            </div>
            <div className="form-group"><label className="form-label">Name *</label><input className="form-input" value={addForm.name} onChange={e=>setAddForm(f=>({...f,name:e.target.value}))} placeholder="Full name"/></div>
            <div className="form-group"><label className="form-label">Designation</label><input className="form-input" value={addForm.designation} onChange={e=>setAddForm(f=>({...f,designation:e.target.value}))} placeholder="e.g. AP/CSE"/></div>
            <div className="form-group"><label className="form-label">Department</label><select className="form-select" value={addForm.dept} onChange={e=>setAddForm(f=>({...f,dept:e.target.value}))}><option value="">— Select —</option>{DEPTS.map(d=><option key={d} value={d}>{d}</option>)}</select></div>
            <div className="form-group">
              <label className="form-label">College{addForm.staff_type==='INT'&&<span style={{marginLeft:6,fontSize:10,color:'var(--int)',fontWeight:600}}>(auto)</span>}</label>
              <input className="form-input" value={addForm.staff_type==='INT'?'Er. Perumal Manimekalai College of Engineering':addForm.college} onChange={e=>addForm.staff_type!=='INT'&&setAddForm(f=>({...f,college:e.target.value}))} placeholder={addForm.staff_type==='INT'?'Er. Perumal Manimekalai College of Engineering':'External college'} readOnly={addForm.staff_type==='INT'} style={addForm.staff_type==='INT'?{background:'#f0f4f9',cursor:'not-allowed'}:{}}/>
            </div>
            <div className="form-group"><label className="form-label">Mobile
              {addForm.mobile_no&&(()=>{
                const v=validateMobile(addForm.mobile_no);
                return v.valid
                  ? <span style={{marginLeft:6,fontSize:10,color:'var(--success)',fontWeight:700}}>✓</span>
                  : <span style={{marginLeft:6,fontSize:10,color:'var(--danger)',fontWeight:700}}>✕ {v.reason}</span>;
              })()}
            </label>
            <input className="form-input mono" value={addForm.mobile_no} onChange={e=>setAddForm(f=>({...f,mobile_no:e.target.value.replace(/\D/g,'').slice(0,10)}))} placeholder="10-digit mobile" maxLength={10}/>
          </div>
          </div>
          <div className="form-grid">
            <div className="form-group">
              <label className="form-label">Account No</label>
              <input className="form-input mono" value={addForm.ac_no} onChange={e=>setAddForm(f=>({...f,ac_no:e.target.value}))} placeholder="Account number"/>
              {addForm.ac_no && addForm.ac_no.length>0 && addForm.ac_no.length<11 && !addForm.ac_no.startsWith('0') && (
                <div style={{fontSize:11,color:'#c77700',marginTop:4,padding:'4px 8px',background:'#fffbeb',border:'1px solid #f6d860',borderRadius:4}}>
                  ⚠ Some banks use accounts starting with 0. Please verify.
                </div>
              )}
            </div>
            <div className="form-group">
              <label className="form-label">IFSC Code
                {ifscStatus.state==='checking'&&<span style={{marginLeft:6,fontSize:10,color:'var(--muted)'}}>⏳</span>}
                {ifscStatus.state==='valid'&&<span style={{marginLeft:6,fontSize:10,color:'var(--success)',fontWeight:700}}>✓ Verified</span>}
                {ifscStatus.state==='invalid'&&<span style={{marginLeft:6,fontSize:10,color:'var(--danger)',fontWeight:700}}>✕ Invalid</span>}
              </label>
              <input className="form-input mono" value={addForm.ifsc_code} onChange={e=>onAddIfsc(e.target.value)} placeholder="e.g. SBIN0001234" maxLength={11}
                style={ifscStatus.state==='valid'?{borderColor:'var(--success)',background:'#f0faf4'}:{}}/>
              {ifscStatus.state==='valid'&&<div style={{fontSize:11,color:'var(--success)',marginTop:2}}>{ifscStatus.data.bank} · {ifscStatus.data.branch}</div>}
            </div>
            <div className="form-group"><label className="form-label">Bank</label><input className="form-input" value={addForm.bank} onChange={e=>setAddForm(f=>({...f,bank:e.target.value}))} placeholder="Bank"/></div>
            <div className="form-group"><label className="form-label">Branch</label><input className="form-input" value={addForm.branch} onChange={e=>setAddForm(f=>({...f,branch:e.target.value}))} placeholder="Branch"/></div>
          </div>
          <div className="form-actions">
            <button className="BP" onClick={addStaff}>Save Staff</button>
            <button className="BE" onClick={()=>setShowAdd(false)}>Cancel</button>
          </div>
        </div>
      )}

      <div className="card">
        <input className="form-input" style={{width:'100%'}} placeholder="🔍 Search staff by name…" value={query} onChange={e=>setQuery(e.target.value)}/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <div className="card" style={{borderTop:'3px solid var(--int)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,paddingBottom:10,borderBottom:'1px solid var(--border)'}}>
            <div>
              <div style={{fontWeight:700,fontSize:14,color:'var(--int)'}}>🏛️ Internal Staff</div>
              <div style={{fontSize:11,color:'var(--muted)'}}>{intStaff.length} staff · {fmt(intTotal)} total</div>
            </div>
            <span className="badge badge-int">INT</span>
          </div>
          {loading?<div style={{padding:20,textAlign:'center',color:'var(--muted)'}}>Loading…</div>:renderTable(intStaff,'int')}
        </div>
        <div className="card" style={{borderTop:'3px solid var(--ext)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10,paddingBottom:10,borderBottom:'1px solid var(--border)'}}>
            <div>
              <div style={{fontWeight:700,fontSize:14,color:'var(--ext)'}}>👥 External Staff</div>
              <div style={{fontSize:11,color:'var(--muted)'}}>{extStaff.length} staff · {fmt(extTotal)} total</div>
            </div>
            <span className="badge badge-ext">EXT</span>
          </div>
          {loading?<div style={{padding:20,textAlign:'center',color:'var(--muted)'}}>Loading…</div>:renderTable(extStaff,'ext')}
        </div>
      </div>
    </div>
  );
}


// ─── PORTAL CONTROL + APPROVALS ──────────────────────────────
function Approvals({season,toast,onApprove,onOpenWork}){
  const [pending,setPending]=useState([]);
  const [searchPending,setSearchPending]=useState('');
  const [loading,setLoading]=useState(false);
  const [access,setAccess]=useState(null); // current portal_access row
  const [activating,setActivating]=useState(false);
  const [duration,setDuration]=useState({value:24,unit:'hours'});
  const [note,setNote]=useState('');
  const [showActivate,setShowActivate]=useState(false);
  const [generatedLink,setGeneratedLink]=useState('');
  const [portalUrl,setPortalUrl]=useState('');
  const [showUrlSetting,setShowUrlSetting]=useState(false);
  
  // Load portal URL from Supabase on mount
  useEffect(()=>{
    let mounted=true;
    (async()=>{
      const {data}=await supabase.from('app_settings').select('value').eq('key','portal_url').maybeSingle();
      if(mounted&&data?.value) setPortalUrl(data.value);
    })();
    return()=>{mounted=false;};
  },[]);
  
  async function savePortalUrl(url){
    if(!url||!url.startsWith('http')){toast.show('Invalid URL','error');return;}
    const cleanUrl=url.trim();
    const {data:{user}}=await supabase.auth.getUser();
    const {error}=await supabase.from('app_settings').upsert({
      key:'portal_url',
      value:cleanUrl,
      updated_at:new Date().toISOString(),
      updated_by:user?.email||'admin'
    },{onConflict:'key'});
    if(error){toast.show(safeError(error,'Save failed. Please try again.'),'error');return;}
    setPortalUrl(cleanUrl);
    toast.show('Portal URL saved (shared across all admins)','success');
    setShowUrlSetting(false);
  }

  useEffect(()=>{if(season){loadPending();loadAccess();}},[season]);
  // Auto-check expiry every 30 seconds
  useEffect(()=>{
    const t=setInterval(()=>{
      if(access?.is_active && access?.expires_at){
        if(new Date(access.expires_at)<new Date()){
          setAccess(a=>({...a,is_active:false}));
          // Also update DB
          supabase.from('portal_access').update({is_active:false}).eq('season_id',season.id);
        }
      }
    },30000);
    return ()=>clearInterval(t);
  },[access]);

  async function loadAccess(){
    const {data,error}=await supabase.from('portal_access').select('*').eq('season_id',season.id).order('id',{ascending:false}).limit(1).maybeSingle();
    if(error) console.error('loadAccess error:',error.message);
    setAccess(data||null);
  }

  async function loadPending(){
    setLoading(true);
    const {data}=await supabase.from('claims').select('*,claim_date_rows(*)').eq('entry_source','portal').eq('status','draft').order('created_at',{ascending:false});
    if(data)setPending(data);
    setLoading(false);
  }

  // Check if portal is currently active
  const now=new Date();
  const isActive=access?.is_active && access?.expires_at && new Date(access.expires_at)>now;
  const expiresAt=access?.expires_at?new Date(access.expires_at):null;
  const timeLeft=expiresAt?Math.max(0,Math.round((expiresAt-now)/60000)):0; // minutes left

  function generateLink(){
    if(!portalUrl){
      toast.show('Please set Portal URL first','error');
      setShowUrlSetting(true);
      setShowActivate(false);
      return;
    }
    const mins=duration.unit==='hours'?duration.value*60:duration.unit==='days'?duration.value*1440:duration.value;
    const expiry=Date.now()+(mins*60000);
    const raw=btoa(season.id+'_'+expiry).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
    // Use the hosted portal URL (configured once by COE)
    const base=portalUrl.replace(/\/$/,'');
    const link=base+(base.includes('?')?'&':'?')+'t='+raw;
    setGeneratedLink(link);
    setShowActivate(false);
  }

  async function deactivate(){
    if(!confirm('Deactivate the portal? External staff will not be able to submit.'))return;
    const {error}=await supabase.from('portal_access').update({is_active:false}).eq('season_id',season.id);
    if(error){toast.show(safeError(error,'Operation failed. Please try again.'),'error');return;}
    toast.show('Portal deactivated','info');
    setAccess(a=>({...a,is_active:false}));
  }

  async function approve(c){
    const {error}=await supabase.from('claims').update({status:'verified'}).eq('id',c.id);
    if(error){toast.show(safeError(error,'Operation failed. Please try again.'),'error');return;}
    logAction('claims',c.id,'UPDATE',{status:'draft'},{status:'verified',source:'portal_approval',name:c.name});
    toast.show('Approved — opening work screen to complete details','success');
    loadPending();onApprove();
    onOpenWork&&onOpenWork(c.work_type_id,c.id);
  }

  async function reject(id){
    if(!confirm('Delete this submission?'))return;
    await supabase.from('claim_date_rows').delete().eq('claim_id',id);
    await supabase.from('claims').delete().eq('id',id);
    toast.show('Submission deleted','info');
    loadPending();onApprove();
  }

  const wt=(id)=>ALL_WORKS.find(w=>w.id===id);

  return(
    <div>
      <div className="page-header" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:10}}>
        <div>
          <div className="page-title">Portal Approvals</div>
          <div className="page-sub">{season?.name} — Manage portal access and review submissions</div>
        </div>
        <input type="text" className="form-input" placeholder="🔍 Search by name or REF..." value={searchPending||''} onChange={e=>setSearchPending(e.target.value)} style={{minWidth:220,fontSize:12}}/>
        <button className="BS" onClick={loadPending}>🔄 Refresh</button>
      </div>

      {/* PORTAL ACCESS CONTROL CARD */}
      <div className="card" style={{borderLeft:`4px solid ${isActive?'var(--success)':'var(--muted)'}`}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:12}}>
          <div>
            <div style={{fontWeight:700,fontSize:15,marginBottom:4}}>
              🌐 External Staff Portal

            </div>
            <div style={{fontSize:13,color:'var(--muted)'}}>Generate a time-limited link and share it with external staff. The link expires automatically.</div>
            {portalUrl&&<div style={{fontSize:12,color:'var(--success)',marginTop:4}}>✓ Portal URL: <span className="mono">{portalUrl}</span></div>}
            {!portalUrl&&<div style={{fontSize:12,color:'var(--danger)',marginTop:4}}>⚠️ Portal URL not configured — click "⚙️ Portal URL" to set</div>}
          </div>
          <div style={{display:'flex',gap:8}}>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button className="BE" onClick={()=>setShowUrlSetting(v=>!v)}>⚙️ Portal URL</button>
            <button className="BP ext" onClick={()=>{
              if(!portalUrl){toast.show('Please set Portal URL first','error');setShowUrlSetting(true);return;}
              setShowActivate(v=>!v);setGeneratedLink('');
            }}>🔗 Generate Portal Link</button>
          </div>
          </div>
        </div>

        {/* GENERATE LINK FORM */}
        {showActivate&&(
          <div style={{marginTop:16,paddingTop:16,borderTop:'1px solid var(--border)'}}>
            <div style={{fontWeight:600,fontSize:13,marginBottom:12}}>Set Link Expiry Duration</div>
            <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'flex-end'}}>
              <div className="form-group">
                <label className="form-label">Duration</label>
                <input type="number" min="1" className="form-input" style={{width:90}}
                  value={duration.value||""} onChange={e=>setDuration(d=>({...d,value:e.target.value===""?"":Number(e.target.value)}))}/>
              </div>
              <div className="form-group">
                <label className="form-label">Unit</label>
                <select className="form-select" value={duration.unit} onChange={e=>setDuration(d=>({...d,unit:e.target.value}))}>
                  <option value="minutes">Minutes</option>
                  <option value="hours">Hours</option>
                  <option value="days">Days</option>
                </select>
              </div>
            </div>
            <div style={{marginTop:10,fontSize:12,color:'var(--muted)'}}>
              Link will expire at: <strong>{new Date(Date.now()+(duration.unit==='hours'?duration.value*3600000:duration.unit==='days'?duration.value*86400000:duration.value*60000)).toLocaleString('en-IN')}</strong>
            </div>
            <div style={{marginTop:12,display:'flex',gap:8}}>
              <button className="BP ext" onClick={generateLink}>🔗 Generate Link</button>
              <button className="BE" onClick={()=>setShowActivate(false)}>Cancel</button>
            </div>
          </div>
        )}
        {/* PORTAL URL SETTING */}
        {showUrlSetting&&(
          <div style={{marginTop:16,paddingTop:16,borderTop:'1px solid var(--border)'}}>
            <div style={{fontWeight:600,fontSize:13,marginBottom:10}}>🌐 Portal URL</div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <input className="form-input" style={{flex:1,minWidth:250,fontFamily:'DM Mono',fontSize:12}}
                placeholder="https://your-portal-url.netlify.app"
                defaultValue={portalUrl}
                onKeyDown={e=>{if(e.key==='Enter')savePortalUrl(e.target.value.trim());}}
                id="portalUrlInput"/>
              <button className="BP ext" onClick={()=>{
                const val=document.getElementById('portalUrlInput').value.trim();
                if(!val){toast.show('Please enter a URL','error');return;}
                if(!val.startsWith('http')){toast.show('URL must start with http:// or https://','error');return;}
                savePortalUrl(val);
              }}>Save</button>
              <button className="BE" onClick={()=>setShowUrlSetting(false)}>Cancel</button>
            </div>
          </div>
        )}

        {/* GENERATED LINK */}
        {generatedLink&&(
          <div style={{marginTop:16,paddingTop:16,borderTop:'1px solid var(--border)'}}>
            <div style={{fontWeight:600,fontSize:13,marginBottom:8,color:'var(--success)'}}>✅ Portal Link Generated — Share this with external staff:</div>
            <div style={{background:'var(--bg)',padding:10,borderRadius:7,marginBottom:10,fontSize:12,lineHeight:1.7}}>
              <div><strong>Exam Season:</strong> {season?.name}</div>
              <div><strong>Generated on:</strong> {new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div>
              <div><strong>Valid for:</strong> {duration.value} {duration.unit}</div>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
              <input readOnly value={generatedLink}
                style={{flex:1,minWidth:200,padding:'8px 10px',border:'1.5px solid var(--border)',borderRadius:7,fontSize:12,fontFamily:'DM Mono',background:'#f9f9f9'}}
                onClick={e=>e.target.select()}/>
              <button className="BP ext" onClick={()=>{navigator.clipboard.writeText(generatedLink);toast.show('Link copied!','success');}}>📋 Copy</button>
            </div>
            <div style={{fontSize:11,color:'var(--muted)',marginTop:6}}>
              This link works for {duration.value} {duration.unit} from now. After that it shows "Link Expired" to external staff.
            </div>
          </div>
        )}
      </div>

      {/* PENDING SUBMISSIONS */}
      <div style={{fontWeight:700,fontSize:15,marginBottom:14,marginTop:8}}>
        Pending Submissions <span style={{fontSize:13,color:'var(--muted)',fontWeight:400}}>({pending.length})</span>
      </div>

      {loading&&<div style={{padding:40,textAlign:'center',color:'var(--muted)'}}>Loading…</div>}

          <div style={{fontWeight:600,color:'var(--muted)'}}>No pending submissions</div>
        </div>
      )}
      {pending.filter(c=>{
        if(!searchPending) return true;
        const q=searchPending.toLowerCase();
        return c.name?.toLowerCase().includes(q) || c.id?.toLowerCase().slice(0,8).includes(q.replace(/[^a-z0-9]/g,'').toLowerCase());
      }).map(c=>{
        const w=wt(c.work_type_id);
        return(
          <div key={c.id} className="card" style={{borderLeft:'4px solid var(--ext)'}}>

// ─── ACTIVITY LOG ─────────────────────────────────────────────
function ActivityLog({season,toast}){
  const [logs,setLogs]=useState([]);
  const [loading,setLoading]=useState(false);
  const [filter,setFilter]=useState('all');
  const [tableFilter,setTableFilter]=useState('all');

  useEffect(()=>{load();},[filter,tableFilter]);

  async function load(){
    setLoading(true);
    let q=supabase.from('audit_log').select('*').order('changed_at',{ascending:false}).limit(500);
    if(filter!=='all') q=q.eq('action',filter);
    if(tableFilter!=='all') q=q.eq('table_name',tableFilter);
    const {data}=await q;
    if(data) setLogs(data);
    setLoading(false);
  }

  function describe(l){
    const data=l.new_data||l.old_data||{};
    const name=data.name||'';
    if(l.table_name==='claims'){
      const wtX=ALL_WORKS.find(w=>w.id===data.work_type_id);
      const wtLabel=wtX?.label||data.work_type_id||'';
      if(l.action==='INSERT') return `Added ${wtLabel} entry${name?' for '+name:''}${data.amount?' — '+fmt(data.amount):''}`;
      if(l.action==='UPDATE'){
        if(l.new_data?.status==='verified') return `Approved portal submission${name?' from '+name:''}: ${wtLabel}`;
        return `Edited ${wtLabel} entry${name?' for '+name:''}`;
      }
      if(l.action==='DELETE') return `Deleted ${wtLabel} entry${name?' for '+name:''}`;
    }
    if(l.table_name==='staff'){
      if(l.action==='INSERT') return `Added ${name||'staff'} (${data.staff_type==='INT'?'Internal':'External'}) to directory`;
      if(l.action==='DELETE') return `Removed ${name||'staff'} from directory`;
      if(l.action==='UPDATE') return `Updated ${name||'staff'} details`;
    }
    return `${l.action} on ${l.table_name}`;
  }

  function relTime(t){
    const diff=Date.now()-new Date(t).getTime();
    const s=Math.floor(diff/1000);
    if(s<60) return 'just now';
    const m=Math.floor(s/60); if(m<60) return m+' min ago';
    const h=Math.floor(m/60); if(h<24) return h+' hr ago';
    const d=Math.floor(h/24); return d+' day'+(d>1?'s':'')+' ago';
  }

  return(
    <div>
      <div className="page-header" style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:10,flexWrap:'wrap'}}>
        <div>
          <div className="page-title">📜 Activity Log</div>
          <div className="page-sub">Audit trail of all add / edit / delete actions — last 500 entries</div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <select className="form-select" value={tableFilter} onChange={e=>setTableFilter(e.target.value)}>
            <option value="all">All Tables</option>
            <option value="claims">Claims only</option>
            <option value="staff">Staff only</option>
          </select>
          <select className="form-select" value={filter} onChange={e=>setFilter(e.target.value)}>
            <option value="all">All Actions</option>
            <option value="INSERT">Added</option>
            <option value="UPDATE">Edited</option>
            <option value="DELETE">Deleted</option>
          </select>
          <button className="BS" onClick={load}>🔄 Refresh</button>
        </div>
      </div>

      {loading?<div style={{padding:40,textAlign:'center',color:'var(--muted)'}}>Loading…</div>:
       logs.length===0?<div className="card" style={{textAlign:'center',padding:40,color:'var(--muted)'}}>No activity matches the selected filters.</div>:
       <div className="card">
         {logs.map(l=>{
           const color=l.action==='INSERT'?'var(--success)':l.action==='UPDATE'?'var(--int)':'var(--danger)';
           const icon=l.action==='INSERT'?'✚':l.action==='UPDATE'?'✎':'🗑';
           return(
             <div key={l.id} style={{display:'flex',gap:12,padding:'12px 0',borderBottom:'1px solid var(--border)'}}>
               <div style={{width:34,height:34,borderRadius:'50%',background:color+'22',color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0,fontWeight:700}}>{icon}</div>
               <div style={{flex:1,minWidth:0}}>
                 <div style={{fontSize:13,fontWeight:500}}>{describe(l)}</div>
                 <div style={{fontSize:11,color:'var(--muted)',marginTop:3}}>
                   <span style={{fontWeight:600}}>{l.changed_by||'coe_admin'}</span> · {relTime(l.changed_at)} · {new Date(l.changed_at).toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
                 </div>
               </div>
             </div>
           );
         })}
       </div>}
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────
function App(){
  const [authed,setAuthed]=useState(false);
  const [authChecking,setAuthChecking]=useState(true);
  const [loginEmail,setLoginEmail]=useState('');
  const [loginPass,setLoginPass]=useState('');
  const [loginErr,setLoginErr]=useState('');
  const [loggingIn,setLoggingIn]=useState(false);
  const [currentUser,setCurrentUser]=useState(null);
  
  // Check existing session on mount + listen for auth changes
  useEffect(()=>{
    let mounted=true;
    supabase.auth.getSession().then(({data:{session}})=>{
      if(!mounted) return;
      if(session){setAuthed(true);setCurrentUser(session.user);}
      setAuthChecking(false);
    });
    const {data:{subscription}}=supabase.auth.onAuthStateChange((event,session)=>{
      if(!mounted) return;
      setAuthed(!!session);
      setCurrentUser(session?.user||null);
    });
    return()=>{mounted=false;subscription.unsubscribe();};
  },[]);
  const [page,setPage]=useState('dashboard');
  const [seasons,setSeasons]=useState([]);
  const [season,setSeason]=useState(null);
  const [sidebarOpen,setSidebarOpen]=useState(true);
  const [pendingCount,setPendingCount]=useState(0);
  const [viewStaffId,setViewStaffId]=useState(null);
  const [showAddSeason,setShowAddSeason]=useState(false);
  const [newSeason,setNewSeason]=useState({id:'',name:''});

  async function addSeason(){
    const name=newSeason.name.trim();
    if(!name){toast.show('Season name is required','error');return;}
    // Auto-generate code from name: take first letters of words + last 2 digits of year
    // e.g. "Nov/Dec 2027" → "ND27", "April/May 2028" → "AM28"
    const yearMatch=name.match(/(\d{2,4})/);
    const yearSuffix=yearMatch?yearMatch[1].slice(-2):'';
    // Get uppercase letters from first parts (before any digits or year)
    const prefix=name.replace(/[\d\/\-\s]/g,'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,2)||'XX';
    let id=prefix+yearSuffix;
    // Ensure uniqueness
    let suffix=1;
    while(seasons.find(s=>s.id===id)){id=prefix+yearSuffix+'_'+suffix;suffix++;}
    const {error}=await supabase.from('exam_seasons').insert([{
      id,name,is_active:true
    }]);
    if(error){toast.show(safeError(error,'Operation failed. Please try again.'),'error');return;}
    toast.show(`Season "${name}" added`,'success');
    setNewSeason({id:'',name:''});
    setShowAddSeason(false);
    // Reload and switch to new one
    const {data}=await supabase.from('exam_seasons').select('*').order('id');
    if(data){
      setSeasons(data);
      const newOne=data.find(s=>s.id===id);
      if(newOne) setSeason(newOne);
    }
  }

  async function deleteSeason(seasonToDelete){
    if(!seasonToDelete) return;
    // Check if season has any claims
    const {count}=await supabase.from('claims').select('*',{count:'exact',head:true}).eq('season_id',seasonToDelete.id);
    let confirmMsg=`Delete exam season "${seasonToDelete.name}"?`;
    if(count>0){
      confirmMsg+=`\n\n⚠️ This season has ${count} claim${count>1?'s':''}. ALL claims and date rows in this season will be PERMANENTLY DELETED.\n\nThis action cannot be undone.`;
    }
    if(!confirm(confirmMsg)) return;
    if(count>0&&!confirm(`Final confirmation: Delete "${seasonToDelete.name}" and ${count} claim${count>1?'s':''}?`)) return;
    // Delete cascade: date_rows -> claims -> season
    const {data:claimIds}=await supabase.from('claims').select('id').eq('season_id',seasonToDelete.id);
    if(claimIds&&claimIds.length){
      await supabase.from('claim_date_rows').delete().in('claim_id',claimIds.map(c=>c.id));
    }
    await supabase.from('claims').delete().eq('season_id',seasonToDelete.id);
    const {error}=await supabase.from('exam_seasons').delete().eq('id',seasonToDelete.id);
    if(error){toast.show(safeError(error,'Delete failed. Please try again.'),'error');return;}
    toast.show(`Season "${seasonToDelete.name}" deleted`,'info');
    // Reload and switch to first available
    const {data}=await supabase.from('exam_seasons').select('*').order('id');
    if(data){
      setSeasons(data);
      if(data.length) setSeason(data[data.length-1]);
      else setSeason(null);
    }
  }
  const [approvalsKey,setApprovalsKey]=useState(0);
  const [editTarget,setEditTarget]=useState(null);
  const toast=useToast();

  useEffect(()=>{loadSeasons();},[]);


  const prevCount=useRef(null);
  useEffect(()=>{
    if(!season) return;
    loadPending();
    // Poll every 20 seconds silently for new portal submissions
    const t=setInterval(loadPending,20000);
    return()=>clearInterval(t);
  },[season]);
  async function loadPending(){
    const {count}=await supabase.from('claims').select('*',{count:'exact',head:true}).eq('entry_source','portal').eq('status','draft');
    const c=count||0;
    // Only notify if count increased (new submission) and we've already loaded once
    if(prevCount.current!==null && c>prevCount.current){
      toast.show(`🔔 New portal submission received — go to Portal Approvals and click Refresh`,'info');
    }
    prevCount.current=c;
    setPendingCount(c);
  }
  async function loadSeasons(){
    const {data}=await supabase.from('exam_seasons').select('*').order('id');
    if(data&&data.length){setSeasons(data);setSeason(data[data.length-1]);}
  }

  async function login(){
    if(!loginEmail.trim()||!loginPass){setLoginErr('Please enter email and password');return;}
    setLoggingIn(true);setLoginErr('');
    const {data,error}=await supabase.auth.signInWithPassword({email:loginEmail.trim(),password:loginPass});
    setLoggingIn(false);
    if(error){
      setLoginErr(error.message.includes('Invalid')?'Invalid email or password.':error.message);
      return;
    }
    setAuthed(true);
    setCurrentUser(data.user);
  }
  async function logout(){
    await supabase.auth.signOut();
    setAuthed(false);
    setCurrentUser(null);
    setLoginEmail('');setLoginPass('');
  }

  if(authChecking) return (
    <div className="login-wrap">
      <div style={{textAlign:'center',color:'#fff',fontSize:14}}>Loading…</div>
    </div>
  );
  if(!authed) return (
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-logo">COE Claims</div>
        <div className="login-sub">Er. Perumal Manimekalai College of Engineering</div>
        <label className="login-label">Email</label>
        <input className="login-input" type="email" autoComplete="email" value={loginEmail} onChange={e=>setLoginEmail(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()} placeholder="coe.admin@pmc.local"/>
        <label className="login-label" style={{marginTop:14}}>Password</label>
        <input className="login-input" type="password" autoComplete="current-password" value={loginPass} onChange={e=>setLoginPass(e.target.value)} onKeyDown={e=>e.key==='Enter'&&login()}/>
        <button className="login-btn" onClick={login} disabled={loggingIn}>{loggingIn?'Signing in…':'Sign In'}</button>
        {loginErr&&<div className="login-err">{loginErr}</div>}
      </div>
    </div>
  );

  const currentWt=ALL_WORKS.find(w=>w.id===page);

  return (
    <div className="layout">
      <Toasts toasts={toast.toasts}/>
      {showAddSeason&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',zIndex:1000,display:'flex',alignItems:'center',justifyContent:'center',padding:20}} onClick={e=>{if(e.target===e.currentTarget)setShowAddSeason(false);}}>
          <div className="card" style={{maxWidth:520,width:'100%',margin:0}}>
            <div style={{fontWeight:700,fontSize:16,marginBottom:6}}>📅 Manage Exam Seasons</div>
            <div style={{fontSize:12,color:'var(--muted)',marginBottom:16}}>Add new seasons or delete existing ones.</div>
            
            {/* ADD NEW */}
            <div style={{padding:14,background:'var(--bg)',borderRadius:8,marginBottom:14}}>
              <div style={{fontWeight:600,fontSize:13,marginBottom:8}}>➕ Add New Season</div>
              <div style={{display:'flex',gap:8}}>
                <input className="form-input" value={newSeason.name} autoFocus
                  style={{flex:1}}
                  onChange={e=>setNewSeason(s=>({...s,name:e.target.value}))}
                  onKeyDown={e=>{if(e.key==='Enter')addSeason();}}
                  placeholder="e.g. Nov/Dec 2026"/>
                <button className="BP" onClick={addSeason}>Add</button>
              </div>
            </div>

            {/* EXISTING SEASONS */}
            <div style={{fontWeight:600,fontSize:13,marginBottom:8}}>Existing Seasons ({seasons.length})</div>
            <div style={{maxHeight:240,overflowY:'auto',border:'1px solid var(--border)',borderRadius:7}}>
              {seasons.length===0?<div style={{padding:14,textAlign:'center',color:'var(--muted)',fontSize:12}}>No seasons yet.</div>:
              seasons.map(s=>(
                <div key={s.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 12px',borderBottom:'1px solid var(--border)'}}>
                  <div>
                    <div style={{fontWeight:600,fontSize:13}}>{s.name}{s.id===season?.id&&<span style={{marginLeft:8,fontSize:10,background:'var(--gold)',color:'#fff',padding:'1px 7px',borderRadius:8}}>ACTIVE</span>}</div>
                    <div style={{fontSize:11,color:'var(--muted)',fontFamily:'DM Mono'}}>Code: {s.id}</div>
                  </div>
                  <button className="BD" style={{padding:'4px 10px',fontSize:11}} onClick={()=>deleteSeason(s)}>🗑 Delete</button>
                </div>
              ))}
            </div>

            <div style={{display:'flex',justifyContent:'flex-end',marginTop:14}}>
              <button className="BE" onClick={()=>{setShowAddSeason(false);setNewSeason({id:'',name:''});}}>Close</button>
            </div>
          </div>
        </div>
      )}
      <button
        onClick={()=>setSidebarOpen(o=>!o)}
        title={sidebarOpen?"Collapse sidebar":"Expand sidebar"}
        style={{position:'fixed',left:sidebarOpen?220:0,top:'50%',transform:'translateY(-50%)',zIndex:200,background:'var(--ink)',color:'#fff',border:'none',borderRadius:'0 6px 6px 0',padding:'10px 6px',cursor:'pointer',fontSize:14,lineHeight:1,transition:'left 0.25s ease'}}
      >{sidebarOpen?'◀':'▶'}</button>
      <div className="sidebar" style={{width:sidebarOpen?220:0,minWidth:sidebarOpen?220:0,overflow:sidebarOpen?'auto':'hidden',borderRight:sidebarOpen?'1px solid var(--border)':'none'}}>
        <div className="sidebar-header">
          <div className="sidebar-title">COE Claims</div>
          <div className="sidebar-sub">Controller of Examinations</div>

        </div>
        <div className="season-box">
          <span className="season-label">📅 Exam Season</span>
          <select className="season-select" value={season?.id||''} onChange={e=>{
            if(e.target.value==='__add_new__'){setShowAddSeason(true);return;}
            const s=seasons.find(x=>x.id===e.target.value);if(s)setSeason(s);
          }}>
            {seasons.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}
            <option disabled>──────────</option>
            <option value="__add_new__">⚙️ Manage Seasons…</option>
          </select>
        </div>
        <div className="nav-group">
          <div className="nav-group-title">Overview</div>
          <div className={`nav-item ${page==='dashboard'?'active-gold':''}`} onClick={()=>setPage('dashboard')}><span className="nav-dot dot-gold"/>Dashboard</div>
          <div className={`nav-item ${page==='approvals'?'active-ext':''}`} onClick={()=>{setPage('approvals');setApprovalsKey(k=>k+1);}}><span className="nav-dot dot-ext"/>Portal Approvals{pendingCount>0&&<span style={{marginLeft:'auto',background:'var(--ext)',color:'#fff',borderRadius:10,padding:'1px 7px',fontSize:11,fontWeight:700}}>{pendingCount}</span>}</div>
          <div className={`nav-item ${page==='activity'?'active-gold':''}`} onClick={()=>setPage('activity')}><span className="nav-dot dot-gold"/>Activity Log</div>
        </div>
        <div className="nav-group">
          <div className="nav-group-title">Staff</div>
          <div className={`nav-item ${page==='staff'?'active-int':''}`} onClick={()=>{setPage('staff');setViewStaffId(null);}}><span className="nav-dot dot-int"/>Staff Directory</div>
        </div>
        <div className="nav-group">
          <div className="nav-group-title">Internal Staff Works</div>
          {INT_WORKS.map(w=>(
            <div key={w.id} className={`nav-item ${page===w.id?'active-int':''}`} onClick={()=>setPage(w.id)}>
              <span className="nav-dot dot-int"/>{w.label}
            </div>
          ))}
        </div>
        <div className="nav-group">
          <div className="nav-group-title">External Staff Works</div>
          {EXT_WORKS.map(w=>(
            <div key={w.id} className={`nav-item ${page===w.id?'active-ext':''}`} onClick={()=>setPage(w.id)}>
              <span className="nav-dot dot-ext"/>{w.label}
            </div>
          ))}
        </div>
        <div className="nav-group">
          <div className="nav-group-title">Consolidated</div>
          <div className={`nav-item ${page==='consol-int'?'active-int':''}`} onClick={()=>setPage('consol-int')}><span className="nav-dot dot-int"/>Internal Consolidated</div>
          <div className={`nav-item ${page==='consol-ext'?'active-ext':''}`} onClick={()=>setPage('consol-ext')}><span className="nav-dot dot-ext"/>External Consolidated</div>
        </div>
        <button className="signout-btn" onClick={logout} title={currentUser?.email||''}>⎋ Sign Out</button>
      </div>
      <div className="main" style={{marginLeft:sidebarOpen?220:0,transition:'margin-left 0.25s ease'}}>
        {!season&&<div style={{padding:40,textAlign:'center',color:'var(--muted)'}}>Loading seasons…</div>}
        {season&&page==='dashboard'&&<Dashboard season={season} toast={toast} seasons={seasons}/>}
        {season&&page==='staff'&&!viewStaffId&&<StaffDirectory season={season} toast={toast} onViewProfile={(id)=>setViewStaffId(id)}/>}
        {season&&page==='staff'&&viewStaffId&&<StaffProfile staffId={viewStaffId} seasons={seasons} toast={toast} onBack={()=>setViewStaffId(null)}/>}
        {season&&page==='consol-int'&&<Consolidated type="int" season={season} toast={toast}/>}
        {season&&page==='consol-ext'&&<Consolidated type="ext" season={season} toast={toast}/>}
        {season&&page==='activity'&&<ActivityLog season={season} toast={toast}/>}
        {season&&page==='approvals'&&<Approvals key={approvalsKey} season={season} toast={toast} onApprove={loadPending} onOpenWork={(wtId,claimId)=>{setPage(wtId);setEditTarget(claimId);}}/>}
        {season&&currentWt&&<WorkScreen wt={currentWt} season={season} toast={toast} editTarget={editTarget} onEditTargetConsumed={()=>setEditTarget(null)}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
