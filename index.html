  --int:#1e4d8c;--int-light:#e8f0fb;--int-mid:#4a7cc7;
  --ext:#6b2080;--ext-light:#f3e8fb;--ext-mid:#9b4dca;

}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);min-height:100vh;}
/* LOGIN */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1e4d8c 0%,#6b2080 100%);}
.login-card{background:#fff;border-radius:16px;padding:40px;width:360px;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.login-logo{font-size:28px;font-weight:700;color:var(--int);margin-bottom:4px;}
.login-sub{color:var(--muted);font-size:13px;margin-bottom:28px;}
.login-label{font-size:13px;font-weight:600;color:var(--text);display:block;margin-bottom:6px;}
.login-input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none;transition:.2s;}
.login-input:focus{border-color:var(--int);}
.login-btn{width:100%;margin-top:20px;padding:12px;background:var(--int);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;}
.login-btn:hover{background:#163a6e;}
.login-err{color:var(--danger);font-size:13px;margin-top:10px;text-align:center;}

.layout{display:flex;min-height:100vh;}
.sidebar{width:220px;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100;transition:width 0.25s ease,transform 0.25s ease;}
.sidebar-header{padding:20px 18px 12px;border-bottom:1px solid var(--border);}
.sidebar-title{font-size:15px;font-weight:700;color:var(--int);}
.sidebar-sub{font-size:11px;color:var(--muted);}
.season-box{margin:10px 14px;padding:8px 12px;background:var(--gold-light);border:1px solid #e6d49a;border-radius:8px;font-size:12px;}
.season-label{color:var(--gold);font-weight:700;display:block;margin-bottom:4px;}
.season-select{width:100%;border:none;background:transparent;font-size:12px;color:var(--gold);font-weight:600;outline:none;cursor:pointer;}
.nav-group{padding:8px 14px 4px;}
.nav-group-title{font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);padding:0 4px;margin-bottom:4px;}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text);transition:.15s;margin-bottom:2px;}
.nav-item:hover{background:var(--bg);}
.nav-item.active-int{background:var(--int-light);color:var(--int);font-weight:600;}
.nav-item.active-ext{background:var(--ext-light);color:var(--ext);font-weight:600;}
.nav-item.active-gold{background:var(--gold-light);color:var(--gold);font-weight:600;}
.nav-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dot-int{background:var(--int);}
.dot-ext{background:var(--ext);}
.dot-gold{background:var(--gold);}
.main{margin-left:260px;padding:28px;flex:1;}
/* CARDS */
.page-header{margin-bottom:22px;}
.page-title{font-size:20px;font-weight:700;}
.page-sub{font-size:13px;color:var(--muted);margin-top:2px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px;box-shadow:var(--shadow);}
/* BUTTONS */

.BP:hover{background:#163a6e;}
.BP.ext{background:var(--ext);}
.BP.ext:hover{background:#51186b;}
.BP.gold{background:var(--gold);}

.BS{background:#fff;color:var(--int);border:1.5px solid var(--int);padding:8px 16px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;}
.BS:hover{background:var(--int-light);}
.BS.ext{color:var(--ext);border-color:var(--ext);}
.BS.ext:hover{background:var(--ext-light);}
.BD{background:#fff;color:var(--danger);border:1.5px solid var(--danger);padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:.15s;}

.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-title{font-size:17px;font-weight:700;}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);}
.modal-body{padding:20px 24px;max-height:70vh;overflow-y:auto;}
.modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;}
/* IMPORT STATUS */
.import-sheet-row{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;}
.import-sheet-name{font-weight:600;font-size:13px;}

.import-status-skip{color:var(--muted);font-weight:700;font-size:12px;}
.import-status-err{color:var(--danger);font-weight:700;font-size:12px;}
/* DROP ZONE */
.drop-zone{border:2.5px dashed var(--border);border-radius:12px;padding:40px;text-align:center;cursor:pointer;transition:.2s;}
.drop-zone:hover,.drop-zone.drag{border-color:var(--int);background:var(--int-light);}
.drop-icon{font-size:36px;margin-bottom:10px;}
.drop-text{font-size:14px;font-weight:600;color:var(--text);}
.drop-sub{font-size:12px;color:var(--muted);margin-top:4px;}
/* PREVIEW TABLE */
.preview-tbl-wrap{overflow-x:auto;margin-top:12px;border:1px solid var(--border);border-radius:8px;}
.preview-tbl{width:100%;border-collapse:collapse;font-size:12px;}
.preview-tbl th{background:var(--bg);padding:7px 9px;text-align:left;font-weight:700;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;}
.preview-tbl td{padding:7px 9px;border-bottom:1px solid var(--border);}
.preview-tbl tr:last-child td{border-bottom:none;}
/* SIGN OUT */
.signout-btn{margin:auto 14px 14px;padding:9px 14px;background:none;border:1.5px solid var(--border);border-radius:8px;font-size:13px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:7px;width:calc(100% - 28px);transition:.15s;}
.signout-btn:hover{background:var(--bg);color:var(--danger);border-color:var(--danger);}
/* DATE ROWS */
.date-rows-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
.date-rows-table th{background:#f8f9fc;padding:6px 8px;border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--muted);}
.date-rows-table td{padding:6px 8px;border:1px solid var(--border);}
.date-rows-table input,.date-rows-table select{width:100%;padding:4px 6px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit;}

.ext-duty-hdr{background:#f0e6f7;font-weight:700;color:var(--ext);text-align:center;padding:5px 8px;border:1px solid var(--border);}

// ─── HELPERS ─────────────────────────────────────────────────
function useToast(){
  const [toasts,setToasts]=React.useState([]);
  const show=(msg,type='info')=>{
    const id=Date.now()+Math.random();
    setToasts(t=>[...t,{id,msg,type}]);

// UUID generator with fallback for older browsers / file:// origins
function uuid(){
  if(typeof crypto!=='undefined' && crypto.randomUUID) return crypto.randomUUID();
  // Fallback: RFC4122 v4 compliant
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{
    const r=Math.random()*16|0;
    return (c==='x'?r:(r&0x3|0x8)).toString(16);
  });
}

function validateMobile(m){
  const d=(m||'').replace(/\D/g,'');
  if(d.length===0) return {valid:false,empty:true};
  if(d.length!==10) return {valid:false,reason:`Must be 10 digits (got ${d.length})`};
  if(!/^[6-9]/.test(d)) return {valid:false,reason:'Must start with 6, 7, 8, or 9'};
  return {valid:true,clean:d};
}

function fmt(n){return n?'₹'+Number(n).toLocaleString('en-IN'):'₹0';}

// Safe error handler — never expose internal errors to users
function safeError(err, userMsg){
  // Log full details to console for debugging
  console.error('[COE]',userMsg||'Operation failed:',err?.message||err);
  // Return user-friendly message
  return userMsg||'Something went wrong. Please try again.';
}

// Auto-split "AP/CSE" or "ASP/IT" style strings into {designation, dept}
// Returns {designation, dept} — if no slash found, returns the original designation and empty dept
const DEPT_LIST=['AERO','EEE','ECE','CSE','IT','AIML','AIDS','MCA','MCO','MBA','CHEM','CIVIL','CSBS','MECH'];
function splitDesignation(rawDesig, existingDept){
  if(!rawDesig) return {designation:'', dept:existingDept||''};
  const s=String(rawDesig).trim();
  // Check if it contains a slash
  if(s.includes('/')){
    const parts=s.split('/').map(p=>p.trim()).filter(Boolean);
    if(parts.length>=2){
      const possibleDept=parts[parts.length-1].toUpperCase();
      if(DEPT_LIST.includes(possibleDept)){
        return {designation:parts.slice(0,-1).join('/'), dept:possibleDept};
      }
    }
  }
  return {designation:s, dept:existingDept||''};
}

// Format subject_code for display — handles both JSON array format and plain string
function fmtSubjects(rawCode, rawName){
  if(!rawCode||rawCode==='null'||rawCode==='undefined') return rawName||'-';
  try{
    const arr=JSON.parse(rawCode);
    if(Array.isArray(arr)){
      // Filter out entries where BOTH code and name are empty
      const valid=arr.filter(s=>s&&((s.code||'').trim()||(s.name||'').trim()));
      if(valid.length===0) return rawName||'-';
      return valid.map(s=>{
        const c=(s.code||'').trim();
        const n=(s.name||'').trim();
        return c?(c+(n?' ('+n+')':'')):(n||'');
      }).filter(Boolean).join(', ')||'-';
    }
  }catch{}
  // Plain string fallback
  const s=String(rawCode).trim();
  if(!s||s==='[]'||s==='{}') return rawName||'-';
  return s+(rawName&&rawName!==s?' — '+rawName:'');
}

// ── EXCEL SHEET BUILDERS — matches MODEL_CLAIM format ───────────
function buildWorkSheet(wt,claims,season){

  rows.push([`Remuneration for ${wt.label}`]);
  rows.push([`End Semester Examination ${season?.name||''}`]);
  rows.push([]);

  // UNIFIED COLUMN HEADERS — same for every work type.
  // These names match database columns EXACTLY for seamless import.
  // DO NOT rename — the import parser reads these exact strings.
  const baseHeaders=['S.No','name','designation','dept','college','mobile_no','ac_no','ifsc_code','bank','branch','subject_code','board_name','claim_desc','amount'];
  const dateHeaders=isExtDuty
    ? ['date','session','ehs_rem','ehs_lump','ihs_rem','rhs_rem']
    : ['date','session','no_sessions'];
  const headers=isDateBased?[...baseHeaders,...dateHeaders]:baseHeaders;
  rows.push(headers);

  // Data rows
  claims.forEach((c,i)=>{
    if(isDateBased && c.claim_date_rows && c.claim_date_rows.length){
      // One row per date entry
      c.claim_date_rows.forEach((d,di)=>{
        const row=[
          di===0?i+1:'',
          di===0?c.name:'',
          di===0?c.designation||'':'',
          di===0?c.dept||'':'',
          di===0?c.college||'':'',
          di===0?c.mobile_no||'':'',
          di===0?c.ac_no||'':'',
          di===0?c.ifsc_code||'':'',
          di===0?c.bank||'':'',
          di===0?c.branch||'':'',
          di===0?fmtSubjects(c.subject_code,c.subject_name):'',
          di===0?c.board_name||'':'',
          di===0?c.claim_desc||'':'',
          di===0?(c.amount||0):'',
          d.date||'',
          d.session||'',
        ];
        if(isExtDuty){
          row.push(d.ehs_rem||0, d.ehs_lump||0, d.ihs_rem||0, d.rhs_rem||0);
        } else {
          row.push(d.no_sessions||0);
        }
        rows.push(row);
      });
    } else {
      const row=[
        i+1, c.name, c.designation||'', c.dept||'', c.college||'',
        c.mobile_no||'', c.ac_no||'', c.ifsc_code||'', c.bank||'', c.branch||'',
        fmtSubjects(c.subject_code,c.subject_name), c.board_name||'', c.claim_desc||'', c.amount||0,
      ];
      if(isDateBased){
        // Empty date fields for entries without date rows
        if(isExtDuty) row.push('','', 0, 0, 0, 0);
        else row.push('','', 0);
      }
      rows.push(row);
    }
  });

  // Total row
  rows.push([]);
  const totalAmt=claims.reduce((s,c)=>s+Number(c.amount||0),0);
  const totalRow=new Array(headers.length).fill('');
  totalRow[0]='TOTAL';
  totalRow[13]=totalAmt; // amount column
  rows.push(totalRow);
  rows.push([]);
  rows.push([]);

  // Signature footer
  rows.push(['DCOE','','','','','COE','','','','','','','','PRINCIPAL']);

  const ws=XLSX.utils.aoa_to_sheet(rows);
  // Column widths
  ws['!cols']=headers.map((h,i)=>{
    if(i===0) return {wch:6};
    if(['name','designation','college','bank','branch','claim_desc'].includes(h)) return {wch:20};
    if(['ac_no','ifsc_code','mobile_no'].includes(h)) return {wch:15};
    return {wch:12};
  });
  return ws;
}

// IFSC API validation
async function lookupIFSC(code){
  const clean=(code||'').trim().toUpperCase();
  if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(clean)) return {valid:false,reason:'Invalid format'};
  try{
    const r=await fetch('https://ifsc.razorpay.com/'+clean);
    if(r.status===404) return {valid:false,reason:'IFSC not found'};
    if(!r.ok) return {valid:false,reason:'API error',network:true};
    const d=await r.json();
    return {valid:true,bank:d.BANK,branch:d.BRANCH,city:d.CITY};
  }catch(e){return {valid:false,reason:'Network error',network:true};}
}
function calcExtDutyRow(r){
  const ehs=Number(r.ehs_rem||0)+Number(r.ehs_lump||0);
  return {...r,ehs_total:ehs,row_total:ehs+Number(r.ihs_rem||0)+Number(r.rhs_rem||0)};
}

// ─── EXCEL IMPORT PARSER ─────────────────────────────────────
// Matches the UNIFIED export format. Header row contains column names
// that exactly match database columns (name, ac_no, ifsc_code, mobile_no, etc.)
// This works for both exported files AND user-filled templates.

function parseSheetToRows(ws, workTypeId){
  const raw = XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:false});
  if(!raw.length) return [];

  // Find the header row — the row that contains column "name" (case-insensitive)
  let headerIdx = -1;
  for(let i=0;i<Math.min(raw.length,20);i++){
    const cells = raw[i].map(c=>String(c||'').toLowerCase().trim());
    if(cells.includes('name') && (cells.includes('ac_no')||cells.includes('ifsc_code')||cells.includes('amount'))){
      headerIdx = i; break;
    }
  }
  if(headerIdx<0) return [];

  // Build column map: header text → column index
  const headers = raw[headerIdx].map(c=>String(c||'').toLowerCase().trim());
  const colMap = {};
  headers.forEach((h,i)=>{ if(h && !(h in colMap)) colMap[h]=i; });

  const get = (r,field)=> colMap[field]!==undefined ? String(r[colMap[field]]||'').trim() : '';
  const getN = (r,field)=> colMap[field]!==undefined ? (parseFloat(r[colMap[field]])||0) : 0;

  // Data rows — skip header row and empty/total rows
  const allRows = raw.slice(headerIdx+1);
  const dataRows = allRows.filter(r=>{
    const name = get(r,'name');
    const lower = name.toLowerCase();
    if(!name) return false;
    if(['name','s.no','sno','total','grand total','dcoe','coe','principal'].includes(lower)) return false;
    return true;
  });

  // Group rows by person (multiple date rows all belong to the same person)
  // A row is a "continuation" if its name column is empty but has date data.
  // For the unified format, each person's first row has all the master fields,
  // subsequent rows (same person) have only date fields filled.
  // We flatten — each row becomes a separate entry for simplicity.
  return dataRows.map(r=>({
    name:         get(r,'name'),
    designation:  get(r,'designation'),
    dept:         get(r,'dept'),
    _raw_desig:   get(r,'designation'), // keep original for splitting
    college:      get(r,'college'),
    college_code: get(r,'college_code'),
    mobile_no:    get(r,'mobile_no'),
    ac_no:        get(r,'ac_no'),
    ifsc_code:    get(r,'ifsc_code').toUpperCase(),
    bank:         get(r,'bank'),
    branch:       get(r,'branch'),
    subject_code: get(r,'subject_code'),
    subject_name: get(r,'subject_name'),
    board_name:   get(r,'board_name'),
    claim_desc:   get(r,'claim_desc'),
    amount:       getN(r,'amount'),
    date:         get(r,'date'),
    session:      get(r,'session') || 'FN',
    no_sessions:  getN(r,'no_sessions') || 1,
    ehs_rem:      getN(r,'ehs_rem'),
    ehs_lump:     getN(r,'ehs_lump'),
    ihs_rem:      getN(r,'ihs_rem'),
    rhs_rem:      getN(r,'rhs_rem'),
  })).filter(r=>r.name && r.name.length>1);
}

// ─── WORK TYPE SCREEN ─────────────────────────────────────────
function WorkScreen({wt,season,toast,editTarget,onEditTargetConsumed}){
  const isInt=INT_WORKS.some(w=>w.id===wt.id);
  const isDateBased=DATE_BASED.includes(wt.id);
  const isExtDuty=wt.id==='EXT_DUTY';
  const isQP=['QP_INT','QP_ANS','QP_EXT'].includes(wt.id);
  const isScrutiny=['SCRUT_INT','SCRUT_EXT'].includes(wt.id);
  const isVal=['VAL_PH1_CHIEF','VAL_PH2_CHIEF','VAL_PH1_INT','VAL_PH2_INT','VAL_PH1_EXT','VAL_PH2_EXT'].includes(wt.id);
  const isTabData=['TABULATOR','DATA_ENTRY'].includes(wt.id);
  // Work types that allow MULTIPLE subjects in one entry (one batch claim covering several papers)
  const isMultiSubject=['QP_INT','QP_ANS','QP_EXT','SCRUT_INT','SCRUT_EXT'].includes(wt.id);
  
  // Helper: parse subjects from form.subject_code (could be JSON array or plain string for legacy data)
  function parseSubjects(rawCode, rawName){
    if(!rawCode) return [{code:'',name:''}];
    // Try parsing as JSON first
    try{
      const arr=JSON.parse(rawCode);
      if(Array.isArray(arr) && arr.length>0) return arr.map(s=>({code:s.code||'',name:s.name||''}));
    }catch{}
    // Legacy: single subject code + name
    return [{code:rawCode||'',name:rawName||''}];
  }
  // Subjects array — managed separately from form, synced on save/edit
  const [subjects,setSubjects]=useState([{code:'',name:''}]);
  const isPrac=['PRACT_INT','PRAC_SKILL','PRAC_EXT'].includes(wt.id);
  const accentClass=isInt?'':'ext';

  const [claims,setClaims]=useState([]);
  const [form,setForm]=useState(emptyClaim(wt.id,season?.id));
  const [editing,setEditing]=useState(null);
  const [loading,setLoading]=useState(false);
  const [ifscStatus,setIfscStatus]=useState({state:'idle'});
  const [staffList,setStaffList]=useState([]);
  const [dupWarn,setDupWarn]=useState(null); // {existing, payloadName}
  const ifscT=useRef(null);

  // Load staff master list for this work type's staff_type
  useEffect(()=>{
    supabase.from('staff').select('*').order('name')
      .then(({data})=>{if(data)setStaffList(data);});
  },[]);
  
  // Custom departments (loaded from Supabase + merged with default DEPTS)
  const [customDepts,setCustomDepts]=useState([]);
  const [showAddDept,setShowAddDept]=useState(false);
  const [newDeptInput,setNewDeptInput]=useState('');
  const allDepts=React.useMemo(()=>{
    const merged=[...DEPTS,...customDepts.filter(d=>!DEPTS.includes(d))];
    return merged.sort((a,b)=>a.localeCompare(b));
  },[customDepts]);
  useEffect(()=>{
    supabase.from('app_settings').select('value').eq('key','custom_depts').maybeSingle()
      .then(({data})=>{
        if(data?.value){try{const arr=JSON.parse(data.value);if(Array.isArray(arr))setCustomDepts(arr);}catch{}}
      });
  },[]);
  async function saveNewDept(){
    const d=newDeptInput.trim().toUpperCase();
    if(!d){toast.show('Enter a department name','error');return;}
    if(DEPTS.includes(d)||customDepts.includes(d)){toast.show('Department already exists','error');return;}
    const updated=[...customDepts,d];
    const {error}=await supabase.from('app_settings').upsert({key:'custom_depts',value:JSON.stringify(updated),updated_at:new Date().toISOString()},{onConflict:'key'});
    if(error){toast.show(safeError(error,'Failed to save'),'error');return;}
    setCustomDepts(updated);
    setNewDeptInput('');
    setShowAddDept(false);
    toast.show('Department added: '+d,'success');
  }

  // Load exam schedule for current season (only used by QP_INT and QP_EXT)
  const [examSchedule,setExamSchedule]=useState({});  // {subject_code: {date, session, name}}
  useEffect(()=>{
    if(!season || (wt.id!=='QP_INT' && wt.id!=='QP_EXT')) {setExamSchedule({});return;}
    supabase.from('exam_schedule').select('*').eq('season_id',season.id)
      .then(({data})=>{
        if(!data){setExamSchedule({});return;}
        const map={};
        for(const r of data){
          if(r.subject_code) map[r.subject_code.toUpperCase().trim()]={date:r.exam_date,session:r.session,name:r.subject_name};
        }
        setExamSchedule(map);
      });
  },[season,wt.id]);
  
  // Sync subjects array when entering edit mode or when subject_code changes (multi-subject types)
  useEffect(()=>{
    if(!isMultiSubject) return;
    if(editing && form.subject_code){
      setSubjects(parseSubjects(form.subject_code, form.subject_name));
    } else if(!editing){
      setSubjects([{code:'',name:''}]);
    }
  },[editing,isMultiSubject,form.subject_code,form.subject_name]);

  function onIfscInput(v){
    const upper=(v||'').toUpperCase();
    fld('ifsc_code',upper);
    clearTimeout(ifscT.current);
    if(upper.length===0){setIfscStatus({state:'idle'});return;}
    ifscT.current=setTimeout(async()=>{
      setIfscStatus({state:'checking'});
      const r=await lookupIFSC(upper);
      if(r.valid){
        setIfscStatus({state:'valid',data:r});
        setForm(f=>({...f,bank:r.bank,branch:r.branch}));
      } else if(r.network) setIfscStatus({state:'error',msg:r.reason});
      else setIfscStatus({state:'invalid',msg:r.reason});
    },400);
  }

  function selectFromStaff(staffId){
    if(!staffId){return;}
    const s=staffList.find(x=>x.id===staffId);
    if(!s) return;
    setForm(f=>({...f,
      name:s.name||'',
      designation:s.designation||'',
      dept:s.dept||'',
      college:s.college||'',
      mobile_no:s.mobile_no||'',
      ac_no:s.ac_no||'',
      ifsc_code:s.ifsc_code||'',
      bank:s.bank||'',
      branch:s.branch||'',
    }));
    // Validate their IFSC too
    if(s.ifsc_code) onIfscInput(s.ifsc_code);
  }

  const pendingTarget=useRef(null);
  useEffect(()=>{
    if(editTarget) pendingTarget.current=editTarget;
    if(season) load();
    // Reset form and edit state when switching work types (prevents cross-contamination)
    setEditing(null);
    setForm(emptyClaim(wt.id,season?.id));
    setSubjects([{code:'',name:''}]);
    setSearchText('');
    setSortMode('name');
  },[season,wt.id]);
  // When editTarget changes (new approval), reload
  useEffect(()=>{
    if(editTarget){pendingTarget.current=editTarget;if(season)load();}
  },[editTarget]);

  async function load(){
    setLoading(true);
    const {data}=await supabase.from('claims').select('*,claim_date_rows(*)').eq('work_type_id',wt.id).eq('season_id',season.id).order('id');
    if(data){
      setClaims(data);
      const targetId=pendingTarget.current;
      if(targetId){
        const c=data.find(x=>x.id===targetId);
        if(c){
          const mappedRows=(c.claim_date_rows||[]).map(r=>({
            ...r,
            date:r.date||'',
            session:r.session||'FN',
            no_sessions:r.no_sessions||1,
            row_total:r.row_amount||0,
            ehs_total:(r.ehs_rem||0)+(r.ehs_lump||0),
            ehs_rem:r.ehs_rem||0,
            ehs_lump:r.ehs_lump||0,
            ihs_rem:r.ihs_rem||0,
            rhs_rem:r.rhs_rem||0,
          }));
          const filled={
            ...emptyClaim(wt.id,season.id),
            ...c,
            ifsc_code:c.ifsc_code||'',
            mobile_no:c.mobile_no||'',
            ac_no:c.ac_no||'',
            bank:c.bank||'',
            branch:c.branch||'',
            no_sessions:c.qty_sessions||1,
            date_rows:mappedRows.length?mappedRows:[newRow()],
          };
          setEditing(c.id);
          setForm(filled);
          pendingTarget.current=null;
          onEditTargetConsumed&&onEditTargetConsumed();
          window.scrollTo(0,0);
        }
      }
    }
    setLoading(false);
  }

  const fld=(k,v)=>{
    if(k==='no_sessions'){
      const n=v===''?'':Number(v);
      const rate=isInt?150:150;
      setForm(f=>({...f,[k]:n,amount:(n||0)*rate}));
    } else if(k==='amount'){
      // Strip leading zeros; keep '' if empty
      const cleaned=v===''?'':Number(v);
      setForm(f=>({...f,[k]:cleaned}));
    } else setForm(f=>({...f,[k]:v}));
  };
  const setDateRow=(i,k,v)=>{
    setForm(f=>{
      const rows=[...f.date_rows];
      // For numeric fields, strip leading zeros
      const numericFields=['no_sessions','ehs_rem','ehs_lump','ihs_rem','rhs_rem'];
      const val=numericFields.includes(k)?(v===''?'':Number(v)):v;
      rows[i]={...rows[i],[k]:val};
      if(isExtDuty) rows[i]=calcExtDutyRow(rows[i]);
      // For simple date types: amount = sum of row_total (user enters per row)
      const isSimpleDateType=['CS','RHS','SQUAD','INT_DUTY','PRACT_INT','PRAC_SKILL','PRAC_EXT'].includes(wt.id);
      if(isSimpleDateType){
        const total=rows.reduce((s,r)=>s+Number(r.row_total||0),0);
        return {...f,date_rows:rows,amount:total};
      }
      // For EXT_DUTY: admin enters total manually
      if(isExtDuty) return {...f,date_rows:rows};
      // For other date-based (none currently): auto-calc from no_sessions×rate
      const total=rows.reduce((s,r)=>s+Number(r.no_sessions||0)*150,0);
      return {...f,date_rows:rows,amount:total};
    });
  };
  const addDateRow=()=>setForm(f=>({...f,date_rows:[...f.date_rows,newRow()]}));
  const removeDateRow=(i)=>setForm(f=>({...f,date_rows:f.date_rows.filter((_,j)=>j!==i)}));

  async function save(){
    if(!form.name){toast.show('Name is required','error');return;}
    // Pre-check 1: Check if name exists as opposite type — only block if SAME person (matching details)
    if(!editing){
      const stype=isInt?'INT':'EXT';
      const oppType=isInt?'EXT':'INT';
      const {data:oppList}=await supabase.from('staff').select('id,mobile_no,ac_no,ifsc_code').eq('name',form.name.trim()).eq('staff_type',oppType);
      if(oppList && oppList.length>0){
        const samePersonMatch=oppList.find(x=>{
          const mobileMatch=form.mobile_no&&x.mobile_no&&form.mobile_no.trim()===x.mobile_no.trim();
          const acMatch=form.ac_no&&x.ac_no&&form.ac_no.trim()===x.ac_no.trim();
          return mobileMatch||acMatch;
        });
        if(samePersonMatch){
          const oppLabel=oppType==='INT'?'Internal':'External';
          toast.show('✕ "'+form.name+'" with same contact/bank details already exists as '+oppLabel+' staff. If different person, add a middle initial.','error');
          return;
        }
        const oppLabel=oppType==='INT'?'Internal':'External';
        toast.show('⚠ Another "'+form.name+'" exists as '+oppLabel+' staff with different details. Saving as different person.','info');
      }
    }
    // Pre-check 2: BLOCK if same name+work type+season exists
    // SMART CHECK: For work types with subject_code or board_name, treat different subjects/boards
    // as separate legitimate entries (e.g., same person setting 2 different question papers).
    if(!editing){
      // Strip title (Mr/Mrs/Miss/Dr) for duplicate comparison
      const nameForDup=(form.name||'').replace(/^(Mr|Mrs|Miss|Dr)\.?\s+/i,'').trim();
      let q=supabase.from('claims').select('id,name,dept,college,mobile_no,ac_no,amount,subject_code,subject_name,board_name,created_at')
        .eq('season_id',season.id)
        .eq('work_type_id',wt.id)
        .ilike('name','%'+nameForDup+'%');
      // If this work type uses subject_code (single-subject mode only), narrow the dup check to same subject too
      // For multi-subject work types, the entry is a batch — block any second entry for same person+work+season
      if(wt.has_subject && form.subject_code && !isMultiSubject){
        q=q.ilike('subject_code',form.subject_code.trim());
      }
      // If this work type uses board_name, narrow the dup check to same board
      if(wt.has_board && form.board_name){
        q=q.ilike('board_name',form.board_name.trim());
      }
      const {data:dups,error:dupErr}=await q.limit(5);
      if(dupErr){toast.show(safeError(dupErr,'Duplicate check failed. Please try again.'),'error');return;}
      if(dups && dups.length>0){
        // Check if any matching entry is genuinely the same person
        // Same name + (same dept OR same mobile OR same account) = duplicate
        const genuineDup=dups.find(d=>{
          const deptMatch=form.dept && d.dept && form.dept===d.dept;
          const mobileMatch=form.mobile_no && d.mobile_no && form.mobile_no===d.mobile_no;
          const acMatch=form.ac_no && d.ac_no && form.ac_no===d.ac_no;
          // If NO details entered yet — block by name alone (safer)
          const noDetails=!form.dept && !form.mobile_no && !form.ac_no;
          return noDetails || deptMatch || mobileMatch || acMatch;
        });
        if(genuineDup){
          setDupWarn({existing:genuineDup,thisName:form.name.trim(),wt:wt});
          return;
        }
        // Same name but genuinely different person (different dept + mobile + account) — allow
      }
    }
    setLoading(true);
    const payload={
      work_type_id:form.work_type_id,season_id:form.season_id,
      name:form.name,designation:form.designation,dept:form.dept,
      college:form.college,ac_no:form.ac_no,ifsc_code:form.ifsc_code,
      bank:form.bank,branch:form.branch,
      mobile_no:form.mobile_no,amount:Number(form.amount)||0,claim_desc:form.claim_desc,
      board_name:form.board_name,college_code:form.college_code||'',
      subject_code: isMultiSubject ? (()=>{ const valid=subjects.filter(s=>(s.code||'').trim()||(s.name||'').trim()); return valid.length?JSON.stringify(valid):form.subject_code||''; })() : form.subject_code,
      subject_name: isMultiSubject ? '' : form.subject_name,
      qty_sessions:form.no_sessions,
    };
    let claimId=editing;
    if(editing){
      const {error}=await supabase.from('claims').update(payload).eq('id',editing);
      if(error){toast.show(safeError(error,'Update failed. Please try again.'),'error');setLoading(false);return;}
      logAction('claims',editing,'UPDATE',null,{name:payload.name,work_type_id:payload.work_type_id,amount:payload.amount,season_id:payload.season_id});
    } else {
      // Generate UUID for new entries (claims.id has no DB default)
      const newId=uuid();
      const {data,error}=await supabase.from('claims').insert([{id:newId,...payload}]).select().single();
      if(error){toast.show(safeError(error,'Save failed. Please try again.'),'error');setLoading(false);return;}
      claimId=data.id;
      logAction('claims',claimId,'INSERT',null,{name:payload.name,work_type_id:payload.work_type_id,amount:payload.amount,season_id:payload.season_id});
    }
    if(isDateBased && claimId){
      await supabase.from('claim_date_rows').delete().eq('claim_id',claimId);
      const datePayload=(form.date_rows||[]).filter(r=>r.date||r.session).map(r=>({
        claim_id:claimId,
        date:r.date||'',
        session:r.session||'FN',
        no_sessions:Number(r.no_sessions)||1,
        ehs_rem:r.ehs_rem||0,
        ehs_lump:r.ehs_lump||0,
        ihs_rem:r.ihs_rem||0,
        rhs_rem:r.rhs_rem||0,
        row_amount:r.row_total||0,
      }));
      await supabase.from('claim_date_rows').insert(datePayload);
    }
    // Auto-add or UPDATE staff directory entry
    // - If new: insert with current form data
    // - If exists: update any missing fields from current form (so quick-fill always has latest details)
    if(form.name && form.name.trim()){
      const stype=isInt?'INT':'EXT';
      const {data:sameTypeExisting}=await supabase.from('staff').select('*').eq('name',form.name.trim()).eq('staff_type',stype).maybeSingle();
      if(!sameTypeExisting){
        await supabase.from('staff').insert([{
          id:uuid(),
          name:form.name.trim(),
          staff_type:stype,
          designation:form.designation||'',
          dept:form.dept||'',
          college:form.college||'',
          mobile_no:form.mobile_no||'',
          ac_no:form.ac_no||'',
          ifsc_code:form.ifsc_code||'',
          bank:form.bank||'',
          branch:form.branch||'',
        }]);
      } else {
        // Fill in any missing fields from current form data (don't overwrite existing values)
        const updates={};
        if(!sameTypeExisting.designation && form.designation) updates.designation=form.designation;
        if(!sameTypeExisting.dept && form.dept) updates.dept=form.dept;
        if(!sameTypeExisting.college && form.college) updates.college=form.college;
        if(!sameTypeExisting.mobile_no && form.mobile_no) updates.mobile_no=form.mobile_no;
        if(!sameTypeExisting.ac_no && form.ac_no) updates.ac_no=form.ac_no;
        if(!sameTypeExisting.ifsc_code && form.ifsc_code) updates.ifsc_code=form.ifsc_code;
        if(!sameTypeExisting.bank && form.bank) updates.bank=form.bank;
        if(!sameTypeExisting.branch && form.branch) updates.branch=form.branch;
        if(Object.keys(updates).length>0){
          await supabase.from('staff').update(updates).eq('id',sameTypeExisting.id);
        }
      }
    }
    toast.show(editing?'Updated!':'Saved!','success');
    setEditing(null);setForm(emptyClaim(wt.id,season.id));load();
  }

  async function del(id){
    if(!confirm('Delete this entry?'))return;
    const {data:oldData}=await supabase.from('claims').select('name,work_type_id,amount,season_id').eq('id',id).maybeSingle();
    await supabase.from('claim_date_rows').delete().eq('claim_id',id);
    await supabase.from('claims').delete().eq('id',id);
    logAction('claims',id,'DELETE',oldData,null);
    toast.show('Deleted','info');load();
  }

  function startEdit(c){
    setEditing(c.id);
    // Explicitly map all date row fields to avoid missing values
    const rawRows=Array.isArray(c.claim_date_rows)?c.claim_date_rows:[];
    const mappedRows=rawRows.map(r=>({
      id:r.id,
      claim_id:r.claim_id,
      date:r.date||'',
      session:r.session||'FN',
      no_sessions:Number(r.no_sessions)||1,
      ehs_rem:Number(r.ehs_rem)||0,
      ehs_lump:Number(r.ehs_lump)||0,
      ihs_rem:Number(r.ihs_rem)||0,
      rhs_rem:Number(r.rhs_rem)||0,
      row_total:Number(r.row_amount)||0,
      ehs_total:(Number(r.ehs_rem)||0)+(Number(r.ehs_lump)||0),
    }));
    const rows=mappedRows.length?mappedRows:[newRow()];
    setForm({
      ...c,
      ifsc_code:c.ifsc_code||'',
      mobile_no:c.mobile_no||'',
      ac_no:c.ac_no||'',
      bank:c.bank||'',
      branch:c.branch||'',
      no_sessions:c.qty_sessions||1,
      subject_code:isMultiSubject?c.subject_code||'':(c.subject_code||''),
      date_rows:rows,
    });
    window.scrollTo(0,0);
  }

    XLSX.utils.book_append_sheet(wb,ws,wt.short.substring(0,31));
    XLSX.writeFile(wb,`${wt.label} - ${season?.name||''}.xlsx`);

  const [sortMode,setSortMode]=useState('name'); // 'name' | 'date' | 'date_asc'

      list.sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0));

      list.sort((a,b)=>new Date(a.created_at||0)-new Date(b.created_at||0));
    } else {

// ─── IMPORT MODAL ─────────────────────────────────────────────
function ImportModal({season,toast,onClose}){
  const [sheets,setSheets]=useState([]); // [{sheetName, workTypeId, rows, status}]
  const [step,setStep]=useState('upload'); // upload | preview | saving | done
  const [saving,setSaving]=useState(false);
  const fileRef=useRef();

  function handleFile(file){
    if(!file)return;
    const reader=new FileReader();
    reader.onload=(e)=>{
      try{
        const wb=XLSX.read(e.target.result,{type:'binary',cellText:true,cellDates:false});
        const parsed=[];
        wb.SheetNames.forEach(sn=>{
          const workTypeId=SHEET_TO_WORK[sn]||SHEET_TO_WORK[sn.trim()];
          if(!workTypeId){parsed.push({sheetName:sn,workTypeId:null,rows:[],status:'skip'});return;}
          const ws=wb.Sheets[sn];
          const rows=parseSheetToRows(ws,workTypeId);
          parsed.push({sheetName:sn,workTypeId,rows,status:rows.length>0?'ready':'empty'});
        });
        setSheets(parsed);
        setStep('preview');
      }catch(err){toast.show('Error reading file: '+err.message,'error');}
    };
    reader.readAsBinaryString(file);
  }

  async function saveAll(){
    setSaving(true);setStep('saving');
    let totalSaved=0,totalFailed=0;
    const updated=[...sheets];
    for(let i=0;i<updated.length;i++){
      const s=updated[i];
      if(s.status!=='ready'||!s.rows.length)continue;
      let success=0,failed=0;
      let lastError='';
      // Multi-subject work types — store subject as JSON array
      const MULTI_SUB=['QP_INT','QP_ANS','QP_EXT','SCRUT_INT','SCRUT_EXT'];
      const isMulti=MULTI_SUB.includes(s.workTypeId);
      for(const row of s.rows){
        // Auto-split "AP/CSE" → designation:"AP", dept:"CSE"
        const split=splitDesignation(row.designation, row.dept);
        row.designation=split.designation;
        row.dept=split.dept;
        // Build subject_code field: JSON for multi-subject types, plain string otherwise
        let subjectCode='', subjectName='';
        if(isMulti){
          if(row.subject_code){
            // Try to parse as JSON first (in case Excel already has JSON), else convert to JSON array
            try{
              const parsed=JSON.parse(row.subject_code);
              subjectCode=Array.isArray(parsed)?JSON.stringify(parsed):JSON.stringify([{code:row.subject_code,name:row.subject_name||''}]);
            }catch{
              subjectCode=JSON.stringify([{code:row.subject_code,name:row.subject_name||''}]);
            }
            subjectName='';
          }
        }else{
          subjectCode=row.subject_code||'';
          subjectName=row.subject_name||'';
        }
        const payload={
          id: uuid(),
          work_type_id:s.workTypeId,season_id:season.id,
          name:row.name||'',designation:row.designation||'',
          dept:row.dept||'',college:row.college||'',college_code:row.college_code||'',
          ac_no:row.ac_no||'',ifsc_code:(row.ifsc_code||'').toUpperCase(),
          bank:row.bank||'',branch:row.branch||'',
          mobile_no:row.mobile_no||'',amount:Number(row.amount)||0,
          claim_desc:row.claim_desc||'',board_name:row.board_name||'',
          subject_code:subjectCode,subject_name:subjectName,
          qty_sessions:row.no_sessions||1,
        };
        const {data,error}=await supabase.from('claims').insert([payload]).select().single();
        if(error){failed++;lastError=error.message;console.error('Insert error:',error.message,payload);continue;}
        
        // Auto-add/update staff directory with bank details
        if(row.name && row.name.trim()){
          const INT_WORKS_LOCAL=['CS','RHS','SQUAD','INT_DUTY','PRACT_INT','PRAC_SKILL','QP_INT','QP_ANS','SCRUT_INT','VAL_PH1_CHIEF','VAL_PH2_CHIEF','VAL_PH1_INT','VAL_PH2_INT','TABULATOR','DATA_ENTRY'];
          const stype=INT_WORKS_LOCAL.includes(s.workTypeId)?'INT':'EXT';
          const {data:existingStaff}=await supabase.from('staff').select('*').eq('name',row.name.trim()).eq('staff_type',stype).maybeSingle();
          if(!existingStaff){
            // Insert new staff with full details from Excel row
            await supabase.from('staff').insert([{
              id:uuid(),
              name:row.name.trim(),
              staff_type:stype,
              designation:row.designation||'',
              dept:row.dept||'',
              college:row.college||'',
              college_code:row.college_code||'',
              mobile_no:row.mobile_no||'',
              ac_no:row.ac_no||'',
              ifsc_code:(row.ifsc_code||'').toUpperCase(),
              bank:row.bank||'',
              branch:row.branch||'',
            }]);
          } else {
            // Fill missing fields from current Excel row (don't overwrite existing values)
            const updates={};
            if(!existingStaff.designation && row.designation) updates.designation=row.designation;
            if(!existingStaff.dept && row.dept) updates.dept=row.dept;
            if(!existingStaff.college && row.college) updates.college=row.college;
            if(!existingStaff.college_code && row.college_code) updates.college_code=row.college_code;
            if(!existingStaff.mobile_no && row.mobile_no) updates.mobile_no=row.mobile_no;
            if(!existingStaff.ac_no && row.ac_no) updates.ac_no=row.ac_no;
            if(!existingStaff.ifsc_code && row.ifsc_code) updates.ifsc_code=row.ifsc_code.toUpperCase();
            if(!existingStaff.bank && row.bank) updates.bank=row.bank;
            if(!existingStaff.branch && row.branch) updates.branch=row.branch;
            if(Object.keys(updates).length>0){
              await supabase.from('staff').update(updates).eq('id',existingStaff.id);
            }
          }
        }
        
        // If date-based, insert a date row
        if(DATE_BASED.includes(s.workTypeId)&&row.date&&data){
          const isED=s.workTypeId==='EXT_DUTY';
          const ehsT=Number(row.ehs_rem||0)+Number(row.ehs_lump||0);
          const rowT=ehsT+Number(row.ihs_rem||0)+Number(row.rhs_rem||0);
          await supabase.from('claim_date_rows').insert([{
            claim_id:data.id,date:row.date,session:row.session||'FN',qty_sessions:row.no_sessions||1,
            ehs_rem:row.ehs_rem||0,ehs_lump:row.ehs_lump||0,ehs_total:isED?ehsT:0,
            ihs_rem:row.ihs_rem||0,rhs_rem:row.rhs_rem||0,row_total:isED?rowT:0,
          }]);
        }
        success++;
      }
      totalSaved+=success;totalFailed+=failed;
      updated[i]={...s,status:failed===0?'saved':`partial (${success}/${s.rows.length})`,lastError};
    }
    setSheets(updated);setSaving(false);setStep('done');
    toast.show(`Import complete: ${totalSaved} saved, ${totalFailed} failed`,'success');
  }

  const readyCount=sheets.filter(s=>s.status==='ready').length;
  const totalRows=sheets.reduce((n,s)=>n+(s.rows?.length||0),0);

  return (
    <div className="modal-bg" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="modal">
        <div className="modal-header">
          <div className="modal-title">📥 Import from Excel</div>
          <button className="modal-close" onClick={onClose}>×</button>
        </div>
        <div className="modal-body">
          {step==='upload'&&(
            <div>
              <p style={{fontSize:13,color:'var(--muted)',marginBottom:16}}>
                Upload an Excel file with one or more sheets matching your MODEL_CLAIM format. Each sheet will be automatically routed to the correct work type.
              </p>
              <div className="drop-zone" onClick={()=>fileRef.current.click()} onDragOver={e=>{e.preventDefault();e.currentTarget.classList.add('drag');}} onDragLeave={e=>e.currentTarget.classList.remove('drag')} onDrop={e=>{e.preventDefault();e.currentTarget.classList.remove('drag');handleFile(e.dataTransfer.files[0]);}}>
                <div className="drop-icon">📂</div>
                <div className="drop-text">Click or drag & drop your Excel file here</div>
                <div className="drop-sub">Supports .xlsx and .xls files · Sheet names must match work type names</div>
              </div>
              <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
              <div style={{marginTop:16,background:'var(--bg)',border:'1px solid var(--border)',borderRadius:8,padding:14}}>
                <div style={{fontWeight:700,fontSize:13,marginBottom:8}}>Recognised Sheet Names</div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(160px,1fr))',gap:4}}>
                  {Object.entries(SHEET_TO_WORK).map(([sn,wt])=>(
                    <div key={sn} style={{fontSize:11,padding:'3px 7px',background:'#fff',border:'1px solid var(--border)',borderRadius:5}}>
                      <span style={{fontFamily:'DM Mono',color:'var(--muted)'}}>{sn}</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
          {(step==='preview'||step==='done')&&(
            <div>
              <div style={{fontWeight:700,fontSize:14,marginBottom:12}}>
                {step==='done'?'✅ Import Complete':'📋 Preview — Review before saving'}
              </div>
              {sheets.map((s,i)=>(
                <div key={i} className="import-sheet-row">
                  <div>
                    <div className="import-sheet-name">{s.sheetName}</div>
                    <div className="import-sheet-count">
                      {s.workTypeId?ALL_WORKS.find(w=>w.id===s.workTypeId)?.label:'—'}
                      {s.rows?.length>0&&` · ${s.rows.length} rows`}
                    </div>
                  </div>
                  <div>
                    {s.status==='ready'&&<span className="import-status-ok">✓ {s.rows.length} rows ready</span>}
                    {s.status==='skip'&&<span className="import-status-skip">⊘ Sheet not recognised</span>}
                    {s.status==='empty'&&<span className="import-status-skip">⊘ No data rows found</span>}
                    {s.status==='saved'&&<span className="import-status-ok">✅ Saved</span>}
                    {s.status?.startsWith('partial')&&<span className="import-status-err">⚠️ {s.status}{s.lastError?' — '+s.lastError:''}</span>}
                  </div>
                </div>
              ))}
              {/* Preview table for first ready sheet */}
              {step==='preview'&&sheets.find(s=>s.status==='ready')&&(
                <div style={{marginTop:16}}>
                  <div style={{fontWeight:700,fontSize:13,marginBottom:6}}>Preview (first matched sheet)</div>
                  <div className="preview-tbl-wrap">
                    <table className="preview-tbl">
                      <thead><tr>
                        <th>#</th><th>Name</th><th>Designation</th><th>Dept</th><th>Account</th><th>IFSC</th><th>Bank</th><th>Amount</th>
                      </tr></thead>
                      <tbody>{sheets.find(s=>s.status==='ready').rows.slice(0,8).map((r,i)=>(
                        <tr key={i}>
                          <td>{i+1}</td><td>{r.name}</td><td>{r.designation||'-'}</td><td>{r.dept||'-'}</td>
                          <td className="mono">{r.ac_no||'-'}</td><td className="mono">{r.ifsc_code||'-'}</td>
                          <td>{r.bank||'-'}</td><td style={{fontWeight:700}}>{fmt(r.amount)}</td>
                        </tr>
                      ))}</tbody>
                    </table>
                    {sheets.find(s=>s.status==='ready').rows.length>8&&
                      <div style={{textAlign:'center',padding:8,fontSize:12,color:'var(--muted)'}}>
                        …and {sheets.find(s=>s.status==='ready').rows.length-8} more rows
                      </div>}
                  </div>
                </div>
              )}
            </div>
          )}
          {step==='saving'&&<div style={{textAlign:'center',padding:40,fontSize:15,color:'var(--muted)'}}>⏳ Saving to database…</div>}
        </div>
        <div className="modal-footer">
          {step==='upload'&&<button className="BE" onClick={onClose}>Cancel</button>}
          {step==='preview'&&<>
            <button className="BE" onClick={()=>setStep('upload')}>← Back</button>
            <button className="BP" onClick={saveAll} disabled={readyCount===0}>
              Save {totalRows} Rows to Database
            </button>
          </>}
          {step==='done'&&<button className="BP" onClick={onClose}>Done</button>}
        </div>
      </div>
    </div>
  );
}
